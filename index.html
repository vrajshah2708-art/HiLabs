<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCheck Handoff Prototype</title>
<meta name="description" content="Working prototype of MCheck® Handoff, a case management workbench for an RN case manager. All patient data is fictional.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#072669;--blue:#2A6AF1;--blue-ink:#1F57D6;--tint:#EAF0FE;--ink:#141B26;--muted:#4F5C77;--faint:#616C80;
  --rule:#DDE2EA;--panel:#F4F6FA;--surface:#FFFFFF;--canvas:#F4F6FA;--head:#072669;--side:#072669;
  --red:#B8322B;--redt:#FBECEA;--redfill:#B8322B;--amberbar:#D79A1F;--green:#0D7553;--greent:#E2F3EC;--amber:#8F5B00;--ambert:#FDF3DE;
  --plum:#7A3B97;--plumt:#F4ECF8;--grey:#4F5C77;--greyt:#EEF0F4;--scrim:rgba(7,18,46,.55);--blk-other:#C9CFDA;--lost:#D46F68;
  --pop:0 12px 32px rgba(7,38,105,.16),0 2px 6px rgba(7,38,105,.08);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sidew:88px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#3D63C9;--blue:#6B95FF;--blue-ink:#9DB8FF;--tint:#1A2A4D;--ink:#E7ECF5;--muted:#B1BCD0;--faint:#9AA6BC;
    --rule:#2A3449;--panel:#1B2333;--surface:#151C2A;--canvas:#0D1220;--head:#B5C9FF;--side:#0A1433;
    --red:#F28B82;--redt:#3A1F22;--green:#6BD6A9;--greent:#123329;--amber:#EDBE63;--ambert:#352A12;
    --plum:#D6AEEA;--plumt:#2E2140;--grey:#B1BCD0;--greyt:#232C3D;--scrim:rgba(0,0,0,.6);--blk-other:#3A4458;
    --pop:0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
    --navy:#3D63C9;--blue:#6B95FF;--blue-ink:#9DB8FF;--tint:#1A2A4D;--ink:#E7ECF5;--muted:#B1BCD0;--faint:#9AA6BC;
    --rule:#2A3449;--panel:#1B2333;--surface:#151C2A;--canvas:#0D1220;--head:#B5C9FF;--side:#0A1433;
    --red:#F28B82;--redt:#3A1F22;--green:#6BD6A9;--greent:#123329;--amber:#EDBE63;--ambert:#352A12;
    --plum:#D6AEEA;--plumt:#2E2140;--grey:#B1BCD0;--greyt:#232C3D;--scrim:rgba(0,0,0,.6);--blk-other:#3A4458;
    --pop:0 12px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.5 var(--sans);font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue-ink)}
.mono{font-family:var(--mono);font-feature-settings:normal}
.muted{color:var(--muted)}
.small{font-size:14px}
h1,h2,h3{margin:0;color:var(--head);font-weight:600;letter-spacing:-.005em}
h1{font-size:28px;line-height:1.2}
h2{font-size:18px;line-height:1.3}
h3{font-size:15.5px}
p{margin:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.side{position:fixed;left:0;top:0;bottom:0;width:var(--sidew);background:var(--side);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:2px;z-index:40}
.logo{width:42px;height:42px;border-radius:10px;background:#fff;color:#072669;display:grid;place-items:center;font:700 15px var(--sans);margin-bottom:10px}
.nav{width:100%;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:#C3CFEE;position:relative;font-size:12.5px;font-weight:500;line-height:1.2;text-align:center}
.nav:hover{color:#fff;background:rgba(255,255,255,.07)}
.nav[aria-current="true"]{color:#fff;background:rgba(255,255,255,.1)}
.nav[aria-current="true"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:#fff;border-radius:0 3px 3px 0}
.nav .badge{position:absolute;top:4px;right:18px;background:#B8322B;color:#fff;font:600 11px var(--sans);border-radius:8px;padding:0 5px;min-width:17px}
.navsep{width:70%;margin:12px 0 6px;border-top:1px solid rgba(255,255,255,.18);padding-top:8px;color:#A9B8E0;font-size:11.5px;text-align:center;line-height:1.2}
.side .spacer{flex:1}
.shell{margin-left:var(--sidew);min-height:100vh}
.top{position:sticky;top:0;z-index:30;height:62px;background:var(--surface);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:14px;padding:0 24px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:0 1 auto}
.brand b{color:var(--head);font-size:18px;font-weight:600;white-space:nowrap}
.brand b sup{font-size:9px}
.brand .plan{color:var(--muted);white-space:nowrap}
.when{font:500 15px var(--sans);color:var(--ink);white-space:nowrap;margin-left:auto;padding:5px 12px;border-radius:8px;background:var(--panel)}
.when .mono{font-weight:600}
.switch{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--surface);border-radius:20px;padding:4px 12px 4px 5px;white-space:nowrap;font-size:14px;font-weight:500}
.switch i{width:30px;height:18px;border-radius:9px;background:var(--rule);position:relative;transition:.2s;flex:none}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch[aria-pressed="true"]{border-color:var(--blue);color:var(--blue-ink)}
.switch[aria-pressed="true"] i{background:var(--blue)}
.switch[aria-pressed="true"] i::after{left:14px}
.iconbtn{border:1px solid var(--rule);background:var(--surface);height:36px;min-width:36px;border-radius:8px;display:inline-grid;place-items:center;color:var(--muted);padding:0 8px}
.iconbtn:hover{color:var(--ink);border-color:var(--faint)}
.who{display:flex;align-items:center;gap:10px;color:var(--muted);white-space:nowrap;font-size:14px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--tint);color:var(--blue-ink);display:grid;place-items:center;font-weight:600;font-size:13px}
.main{padding:24px 28px 150px;max-width:1500px;margin:0 auto;width:100%}
body.has-dock .main{padding-bottom:190px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);font-weight:500;white-space:nowrap;font-size:15px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:#2A6AF1;border-color:#2A6AF1;color:#fff}
.btn.primary:hover{background:#1F57D6}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px}
.btn.big{min-height:48px;padding:0 22px;font-size:16px;font-weight:600}
.btn.ghost{border-color:transparent;background:none;color:var(--blue-ink)}
.btn.ghost:hover{background:var(--tint)}
.link{border:0;background:none;color:var(--blue-ink);padding:0;font-weight:500;font-size:inherit}
.link:hover{text-decoration:underline}

/* ---------- 3+1 chips ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:3px 11px;border-radius:14px;font-size:14px;font-weight:500;line-height:1.3;vertical-align:middle;text-align:left;border:0}
.chip svg{flex:none}
.chip.ok{background:var(--greent);color:var(--green)}
.chip.check{background:var(--ambert);color:var(--amber)}
.chip.conflict{background:var(--plumt);color:var(--plum)}
.chip.missing{background:var(--greyt);color:var(--grey)}
.chip[data-prov]{cursor:pointer}
.chip[data-prov]:hover{filter:brightness(.97)}
.measure{display:inline-flex;border:1px solid var(--head);color:var(--head);border-radius:6px;padding:1px 8px;font-size:14px;font-weight:500}
.pin{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font:600 13px var(--sans);flex:none}
.kbd{font:500 12px var(--mono);border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--muted);background:var(--surface)}
.whybox{border-left:3px dashed var(--blue);background:var(--tint);border-radius:0 8px 8px 0;padding:10px 14px;font-size:14px;color:var(--ink)}
.whybox .lbl{font-size:12.5px;font-weight:600;color:var(--blue-ink);letter-spacing:.04em;text-transform:uppercase;display:block;margin-bottom:2px}

/* urgency = left border, not a chip */
.u-red{box-shadow:inset 4px 0 0 var(--redfill)}
.u-amber{box-shadow:inset 4px 0 0 var(--amberbar)}
.u-blue{box-shadow:inset 4px 0 0 var(--blue)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 20px 8px}
.card-h p{margin-top:2px;color:var(--muted);font-size:14px}
.card-h > .chip{white-space:nowrap;flex:none}
.card-b{padding:6px 20px 18px}
.grid-main{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:start}
.stack{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.stack > *{min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hr{height:1px;background:var(--rule);margin:12px 0}
.eyebrow{font:600 13px var(--sans);letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid transparent;background:none;border-radius:18px;padding:5px 13px;font-size:14px;color:var(--muted);font-weight:500}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--tint);color:var(--blue-ink)}
.callout{border-radius:8px;padding:10px 14px;font-size:14px}
.callout.red{background:var(--redt)}
.callout.blue{background:var(--tint)}
.callout.green{background:var(--greent)}
.callout.amber{background:var(--ambert)}
.list{display:grid;gap:0}
.list > div{padding:10px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.list > div:last-child{border-bottom:0}

/* ---------- today ---------- */
.hero{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:14px}
.hero .sum{margin-top:6px;font-size:16px;color:var(--muted)}
.hero .sum b{color:var(--ink)}
.progress{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 16px;margin-bottom:18px;font-size:14.5px}
.bar{flex:1;height:8px;background:var(--greyt);border-radius:4px;overflow:hidden;min-width:80px}
.bar > i{display:block;height:100%;background:var(--green);transition:width .4s}
.tip{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--tint);border-radius:10px;padding:10px 16px;margin-bottom:18px;font-size:14.5px}
.nowcard{padding:18px 22px}
.nowcard .big{font-size:17px;margin-top:4px}
.ranked{width:100%;border-collapse:collapse}
.ranked th{font-size:14px;font-weight:500;color:var(--muted);text-align:left;padding:10px 14px;background:var(--panel);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.ranked td{padding:14px;border-bottom:1px solid var(--rule);vertical-align:top;font-size:14.5px}
.ranked tr.r{cursor:pointer}
.ranked tr.r:hover td{background:var(--panel)}
.ranked tr.r.sel td{background:var(--tint)}
.ranked .nm{font-weight:600}
.ranked .sub{color:var(--muted);font-size:14px}
.ranked .n{font:600 14px var(--sans);color:var(--muted);width:40px}
.chips2{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.whyrow td{background:var(--panel);padding:12px 14px 14px 54px!important}
.whygrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;font-size:14px}
.whygrid b{display:block;font-size:13px;color:var(--muted);font-weight:500}
.expander{border:0;background:none;color:var(--blue-ink);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:4px;padding:2px 0}
.bars{display:flex;align-items:flex-end;gap:12px;height:110px;position:relative;margin-top:6px}
.bars .cap{position:absolute;left:0;right:0;border-top:1.5px dashed var(--faint)}
.bars .cap span{position:absolute;right:0;top:-20px;font-size:14px;color:var(--muted)}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;justify-content:flex-end;height:100%}
.bcol .stk{width:100%;max-width:34px;border-radius:4px 4px 0 0;transition:height .5s}
.bcol .v{font:600 14px var(--sans)}
.bcol .d{font-size:14px;color:var(--muted)}

/* ---------- member ---------- */
.recent{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.recent .lbl{font-size:14px;color:var(--muted);font-weight:500;margin-right:2px}
.mtab{border:1px solid var(--rule);background:var(--surface);border-radius:20px;padding:6px 14px;display:flex;gap:8px;align-items:center;font-size:14px;font-weight:500}
.mtab:hover{border-color:var(--faint)}
.mtab[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);color:var(--blue-ink)}
.mtab .dot{width:8px;height:8px;border-radius:50%;flex:none}
.mtop{padding:20px 24px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px}
.mtop h1{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.mtop h1 small{font:400 15px var(--sans);color:var(--muted)}
.mtop .contact{color:var(--muted);font-size:14.5px;margin-top:4px}
.line8{font-size:18px;line-height:1.45;font-weight:600;color:var(--ink);margin-top:14px;max-width:880px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.worry{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.worry .q{font-size:14px;color:var(--muted);font-weight:500}
.seg{display:flex;gap:2px;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:2px}
.seg button{border:0;background:none;border-radius:6px;padding:7px 12px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"][data-v="Stable"]{background:var(--greent);color:var(--green)}
.seg button[aria-pressed="true"][data-v="Watch closely"]{background:var(--ambert);color:var(--amber)}
.seg button[aria-pressed="true"][data-v="Unstable"]{background:var(--redfill);color:#fff}
.timeline{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);overflow-x:auto;padding:4px 2px 6px}
.tl{position:relative;padding:24px 14px 0 0}
.tl::before{content:"";position:absolute;top:8px;left:0;right:0;height:2px;background:var(--rule)}
.tl:last-child::before{right:auto;width:30px}
.tl .node{position:absolute;top:1px;left:0;width:16px;height:16px;border-radius:50%;border:2px solid var(--faint);background:var(--surface)}
.tl .node::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--faint)}
.tl.risk .node{border-color:var(--red)}.tl.risk .node::after{background:var(--red)}
.tl.cur .node{border-color:var(--head)}.tl.cur .node::after{background:var(--head)}
.tl .w{font:500 14px var(--sans);color:var(--muted);display:block;margin:2px 0 3px}
.tl .x{font-size:14.5px}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0}
.num{padding:14px 18px;border-right:1px solid var(--rule)}
.num:last-child{border-right:0}
.num .l{font-size:14px;color:var(--muted)}
.num .v{font:600 22px var(--sans);margin:2px 0}
.num .v.warn{color:var(--amber)}
.num .v.bad{color:var(--red)}
.num .s{font-size:14px;color:var(--muted)}
.meds{width:100%;border-collapse:collapse;font-size:15px}
.meds th{text-align:left;font-weight:500;color:var(--muted);font-size:14px;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--panel)}
.meds td{padding:14px 16px;border-bottom:1px solid var(--rule);vertical-align:top}
.meds tr:last-child td{border-bottom:0}
.meds td.nt{color:var(--muted);font-size:14px}
.meds .dn{font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px}
.steps li .pin{border:0;cursor:pointer;width:26px;height:26px}
.steps li.done .pin{background:var(--green)}
.steps li.done b{text-decoration:line-through;color:var(--muted)}
.steps li b{display:block;font-size:15px}
.steps li span{color:var(--muted);font-size:14px}
.wait{display:grid;gap:10px;font-size:14.5px}
.wait > div{display:grid;gap:4px}
.flags{display:grid;gap:10px;font-size:14.5px}
.flags > div{display:grid;grid-template-columns:20px 1fr;gap:8px}
.flags svg{color:var(--blue-ink);margin-top:2px}
.rawtable{width:100%;border-collapse:collapse;font-size:14px}
.rawtable th{text-align:left;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--rule);font-size:14px}
.rawtable td{padding:8px 10px;border-bottom:1px solid var(--rule)}
.rawtable td.mono{font-size:14px}
.rawtable td.bad{background:var(--redt);color:var(--red)}
.rawtable td.good{background:var(--greent);color:var(--green)}
.imp{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px}
.imp:last-child{border-bottom:0}

/* dock (Confirm & start / Confirm & save) */
.dock{position:fixed;left:var(--sidew);right:0;bottom:0;z-index:35;background:var(--surface);border-top:1px solid var(--rule);box-shadow:0 -6px 20px rgba(7,38,105,.08);padding:12px 28px;display:flex;align-items:center;gap:16px}
.dock .ttl{font-weight:600;color:var(--head);white-space:nowrap}
.dock .mid{flex:1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0;font-size:14px}
.dock .short{display:none;font-weight:600}

/* ---------- call ---------- */
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pick{border:1px solid var(--rule);background:var(--surface);border-radius:12px;padding:14px 16px;text-align:left;display:grid;gap:4px}
.pick:hover{border-color:var(--faint)}
.pick[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.pick b{font-size:15.5px}
.pick span{font-size:14px;color:var(--muted)}
.pick .done{color:var(--green);font-weight:600}
.callhead{padding:16px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}
.outcomes{display:flex;gap:8px;flex-wrap:wrap}
.outcomes button{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14.5px}
.outcomes button:hover{border-color:var(--faint)}
.outcomes button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.outcomes button.ok{border-color:var(--green);color:var(--green)}
.outcomes button.ok[aria-pressed="true"]{background:var(--green);color:#fff}
.call-grid{display:grid;grid-template-columns:270px minmax(0,1fr) 320px;gap:18px;align-items:start}
.item{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.item:last-child{border-bottom:0}
.item input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--green)}
.item b{font-size:15px}
.item p{color:var(--muted);font-size:14px;margin-top:2px}
.sec{border-bottom:1px solid var(--rule)}
.sec:last-child{border-bottom:0}
.sec-h{display:flex;align-items:center;gap:12px;padding:12px 20px;flex-wrap:wrap}
.sec-h h3{font-size:16px;flex:1;min-width:120px}
.sec-h .meta{font-size:14px;color:var(--muted)}
.sec-b{padding:0 20px 12px}
.fld{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--rule);font-size:14.5px}
.fld .q{font-weight:500}
.fld .cue{font-size:14px;color:var(--muted);margin-top:2px}
.jin{width:100%;border:1.5px dashed var(--blue);border-radius:6px;background:var(--surface);padding:7px 9px;font-size:14.5px}
.jin:focus{outline:0;border-style:solid}
.jin.filled{border-style:solid;border-color:var(--rule)}
.notedraft{border:1px solid var(--rule);border-radius:8px;padding:12px 14px;font-size:14.5px;line-height:1.6;background:var(--panel)}
.notedraft p{margin:0 0 6px}
.notedraft .br{background:var(--ambert);color:var(--amber);border-radius:4px;padding:0 4px;font-weight:600}
.notedraft .fill{background:var(--greent);color:var(--green);border-radius:4px;padding:0 4px;font-weight:600}
.src{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--tint);color:var(--blue-ink);font:600 11px var(--sans);border:0;vertical-align:2px;margin-left:3px;padding:0;cursor:pointer}
.ba{width:100%;border-collapse:collapse;font-size:14.5px}
.ba td,.ba th{padding:9px 10px;border-bottom:1px solid var(--rule);text-align:left}
.ba th{font-weight:500;color:var(--muted);font-size:14px}
.ba .t{background:var(--redt);color:var(--red);font-weight:600;text-align:center;border-radius:4px;white-space:nowrap;padding:2px 8px}
.ba .h{background:var(--greent);color:var(--green);font-weight:600;text-align:center;border-radius:4px;white-space:nowrap;padding:2px 8px}

/* ---------- flag ---------- */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.vs .box{border:1px solid var(--rule);border-radius:10px;padding:16px 18px}
.vs .box.win{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.vs .box .l{color:var(--muted);font-size:14px}
.vs .box b{display:block;font-size:18px;margin:4px 0 6px;line-height:1.35}
.sig{width:100%;border-collapse:collapse;font-size:15px}
.sig th{text-align:left;color:var(--muted);font-weight:500;font-size:14px;padding:9px 12px;background:var(--panel)}
.sig td{padding:12px;border-bottom:1px solid var(--rule);vertical-align:top}

/* ---------- reviewer zone ---------- */
.zone{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--blue-ink);background:var(--tint);border-radius:12px;padding:2px 10px;margin-bottom:8px}
.dgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;align-items:start}
.dcol{background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.dcol-h{background:var(--navy);color:#fff;padding:12px 14px}
.dcol-h .k{font:500 14px var(--sans);color:#C9D6F7}
.dcol-h b{display:block;font-size:15.5px;margin-top:2px}
.dcol-b{padding:10px;display:grid;gap:8px}
.dtile{border:1px solid var(--rule);border-left:3px solid var(--green);border-radius:6px;padding:9px 11px;text-align:left;background:var(--panel);width:100%}
.dtile:hover{border-color:var(--faint);border-left-color:var(--green)}
.dtile.lite{border:1px dashed var(--amber);border-left:1px dashed var(--amber);background:var(--surface)}
.dtile.later{border-left-color:var(--faint);background:var(--surface)}
.dtile b{display:block;font-size:14.5px;line-height:1.3}
.dtile span{display:block;font-size:14px;color:var(--muted);margin-top:3px;line-height:1.4}
.dtile .tagl{display:inline-block;font-size:13px;font-weight:600;color:var(--amber);margin-top:4px}
.dtile.dim{opacity:.25}
.rule{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;padding:14px 18px;border-bottom:1px solid var(--rule);align-items:start}
.rule:last-child{border-bottom:0}
.rule .id{font:600 15px var(--sans);color:var(--head)}
.rule .eq{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;margin-top:6px}
.rule .in{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:2px 10px}
.rule .op{color:var(--muted);font-weight:600}
.rule .out{background:var(--redt);color:var(--red);border-radius:12px;padding:2px 10px;font-weight:500}
.matrix{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.matrix h3{padding:9px 12px;border-radius:6px;font-size:15px}
.matrix .mc div{padding:9px 12px;border-bottom:1px solid var(--rule);font-size:14.5px}
.ttable{width:100%;border-collapse:collapse;font-size:14.5px}
.ttable th{text-align:left;font-weight:500;color:var(--muted);font-size:14px;padding:9px 12px;background:var(--panel);border-bottom:1px solid var(--rule)}
.ttable td{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
.dclock .s{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:10px 0 10px 16px;border-left:2px solid var(--head)}
.dclock .s.hot{border-left-color:var(--red)}
.dclock .s .k{font:600 15px var(--sans);color:var(--head)}
.dclock .s.hot .k{color:var(--red)}
.blocks{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;max-width:300px}
.blk{aspect-ratio:1;border-radius:4px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--green)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sl{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.sl input[type=range]{width:100%;accent-color:var(--blue)}
.sl output{font-weight:600;text-align:right}
.cmp{width:100%;border-collapse:collapse;font-size:15px}
.cmp th{font-weight:600;font-size:14px;text-align:right;padding:10px 12px;border-bottom:2px solid var(--rule);color:var(--muted)}
.cmp th:first-child{text-align:left}
.cmp th.tg{color:var(--blue-ink)}
.cmp td{padding:10px 12px;border-bottom:1px solid var(--rule);text-align:right;font-weight:500}
.cmp td:first-child{text-align:left;font-weight:400}
.cmp td.tg{background:var(--tint);color:var(--head);font-weight:700}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--rule);border-radius:12px;background:var(--surface);overflow:hidden;margin-bottom:18px}
.kpi > div{padding:16px 18px;border-right:1px solid var(--rule)}
.kpi > div:last-child{border-right:0}
.kpi .v{font:600 30px var(--sans);color:var(--head);line-height:1.1}
.kpi .v small{font-size:16px;color:var(--muted);font-weight:500}
.kpi .l{font-size:14px;color:var(--muted);margin-top:4px}
.mrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.mrow span:first-child{min-width:0}
.mrow span:last-child{font-weight:600;white-space:nowrap}
.ns{background:var(--navy);color:#fff;border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.ns b{font:600 28px var(--sans);white-space:nowrap}
.phase{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.phase > div{border-top:3px solid var(--blue);padding-top:8px;font-size:14px}
.phase > div:first-child{border-top-color:var(--navy)}
.phase b{display:block;font-size:14px;color:var(--muted)}
.feat{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:6px;font-size:14.5px;margin-bottom:4px}
.feat.mvp{background:var(--greent)}
.feat .ef{font-weight:600;white-space:nowrap}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:80;display:grid;place-items:center;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:14px;width:min(620px,100%);max-height:calc(100vh - 40px);overflow:auto;box-shadow:var(--pop);animation:rise .18s}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
.modal-h{padding:20px 24px 8px;display:flex;justify-content:space-between;gap:12px}
.modal-h p{color:var(--muted);font-size:14.5px;margin-top:4px}
.modal-b{padding:8px 24px 18px}
.modal-f{padding:14px 24px;border-top:1px solid var(--rule);display:flex;justify-content:flex-end;gap:10px;align-items:center;flex-wrap:wrap}
.opt{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:15px}
.opt input{width:18px;height:18px;accent-color:var(--green);margin:2px 0 0}
.opt .muted{font-size:14px}
.draft{border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:12px 14px;font-size:15px;line-height:1.6}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:85;box-shadow:var(--pop);display:flex;flex-direction:column;animation:slide .2s}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.drawer-h{padding:18px 22px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.drawer-b{padding:8px 22px 24px;overflow:auto;flex:1}
.ledger{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--rule);font-size:15px}
.ledger .t{font:500 14px var(--mono);color:var(--muted);padding-top:1px}
.ledger .ft{font-size:14px;color:var(--muted);margin-top:3px}
.ledger .ft s{color:var(--faint)}
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:95;display:grid;gap:8px;justify-items:center;pointer-events:none}
body.has-dock .toasts{bottom:96px}
.toast{background:#0B1638;color:#fff;border-radius:10px;padding:10px 16px;font-size:14.5px;display:flex;gap:10px;align-items:center;box-shadow:var(--pop);animation:rise .2s;max-width:min(560px,90vw)}
.toast svg{color:#7FE0B5;flex:none}
.prov{position:fixed;z-index:99;background:#0B1638;color:#E9EEFA;border-radius:8px;padding:10px 12px;font-size:14px;max-width:320px;box-shadow:var(--pop);line-height:1.5}
.prov .pk{font-size:12px;font-weight:600;color:#9FB4E6;text-transform:uppercase;letter-spacing:.05em}
.palette{width:min(620px,100%);align-self:start;margin-top:10vh}
.palette input{width:100%;border:0;border-bottom:1px solid var(--rule);padding:16px 20px;font-size:16px;background:none;outline:0}
.palette ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.palette li{padding:9px 14px;border-radius:8px;display:flex;justify-content:space-between;gap:10px;cursor:pointer;font-size:15px}
.palette li[aria-selected="true"]{background:var(--tint);color:var(--blue-ink)}
.palette li span{color:var(--muted);font-size:14px}

/* demo pill */
.demo{position:relative}
.demo > button{border:1px dashed var(--faint);background:var(--surface);color:var(--muted);border-radius:18px;height:36px;padding:0 14px;font-weight:600;font-size:14px;white-space:nowrap}
.demo > button:hover{color:var(--ink);border-color:var(--ink)}
.demo-p{position:fixed;right:20px;top:70px;z-index:60;width:290px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--pop);padding:14px 16px;display:grid;gap:10px;font-size:14px}
.demo-p .jumps{display:flex;gap:6px;flex-wrap:wrap}
.demo-p .jumps button{border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:5px 9px;font:500 14px var(--mono)}
.demo-p .jumps button[aria-pressed="true"]{border-color:var(--blue);color:var(--blue-ink);background:var(--tint)}

/* tour */
.spot{position:fixed;z-index:70;border-radius:12px;box-shadow:0 0 0 3px var(--blue),0 0 0 9999px rgba(7,18,46,.4);pointer-events:none;transition:all .35s cubic-bezier(.2,.8,.2,1)}
.tourcard{position:fixed;z-index:90;right:22px;bottom:22px;width:min(380px,calc(100vw - 32px));background:var(--surface);border-radius:14px;box-shadow:var(--pop);border:1px solid var(--rule);animation:rise .2s;padding:16px 18px}
.tourcard h3{font-size:17px;margin:4px 0 6px}
.tourcard p{font-size:15px}
.tourcard .f{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-top:14px}
.dots{display:flex;gap:5px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--rule)}
.dots i.on{background:var(--blue)}

/* welcome */
.welcome{width:min(960px,100%);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);overflow:hidden;padding:0}
.welcome > div{min-width:0}
.welcome .story{background:linear-gradient(135deg,#092255,#2B1F77);color:#fff;padding:34px;display:flex;flex-direction:column;gap:14px}
.welcome .story .eyebrow{color:#B9CBF8}
.welcome .story h1{color:#fff;font-size:33px;line-height:1.14}
.welcome .story p{color:#DCE6FD;font-size:16px}
.welcome .rt{padding:30px;display:flex;flex-direction:column;gap:12px}
.pillar{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule)}
.pillar b{display:block;font-size:16px;color:var(--head)}
.pillar span{font-size:14.5px;color:var(--muted)}
.wblocks{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:4px;width:100%;margin-top:auto}
.wblocks i{aspect-ratio:1;border-radius:2px;border:1px solid rgba(255,255,255,.22)}
.wblocks i.bl{background:#D46F68;border-color:transparent}
.wblocks i.bt{background:#6B95FF;border-color:transparent}

.foot{margin-top:28px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.flash{animation:flash 1.4s}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(42,106,241,.6)}100%{box-shadow:0 0 0 14px rgba(42,106,241,0)}}

/* ---------- responsive ---------- */
@media (max-width:1280px){
  .call-grid{grid-template-columns:260px minmax(0,1fr)}
  .call-grid > .notecol{grid-column:1 / -1}
  .dgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:1200px){ .brand .plan{display:none} }
@media (max-width:1100px){
  .grid-main,.g2,.g3{grid-template-columns:minmax(0,1fr)}
  .who span{display:none}
  .welcome{grid-template-columns:minmax(0,1fr)}
  .whygrid{grid-template-columns:minmax(0,1fr)}
  .matrix{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi > div:nth-child(2){border-right:0}
  .kpi > div:nth-child(-n+2){border-bottom:1px solid var(--rule)}
}
@media (max-width:820px){
  :root{--sidew:0px}
  .side{top:auto;bottom:0;right:0;width:auto;height:62px;flex-direction:row;justify-content:space-around;padding:0 2px}
  .side .logo,.side .spacer,.navsep{display:none}
  .nav{flex:1;padding:8px 0 6px;font-size:11.5px}
  .nav[aria-current="true"]::before{left:22%;right:22%;top:0;bottom:auto;width:auto;height:3px;border-radius:0 0 3px 3px}
  .nav .badge{right:12px}
  .shell{margin-left:0}
  .top{padding:0 14px;gap:8px;height:56px}
  .brand,.switch .lbl,.who{display:none}
  .when{margin-left:0;margin-right:auto;font-size:14px}
  .main{padding:16px 14px 150px}
  body.has-dock .main{padding-bottom:200px}
  .dock{left:0;bottom:62px;padding:10px 14px;gap:10px}
  .dock .ttl,.dock .mid{display:none}
  .dock .short{display:block;flex:1}
  .demo-p{right:12px;top:62px}
  body.has-dock .toasts,.toasts{bottom:140px}
  .tourcard{right:12px;bottom:76px}
  .call-grid,.vs,.dgrid,.mtop,.callhead{grid-template-columns:minmax(0,1fr)}
  .worry{align-items:flex-start}
  .ranked thead{display:none}
  .ranked,.ranked tbody,.ranked tr,.ranked td{display:block;width:100%}
  .ranked tr.r{border-bottom:1px solid var(--rule);padding:8px 0}
  .ranked td{border:0;padding:4px 14px}
  .ranked td.n{display:none}
  .whyrow td{padding:12px 14px!important}
  .meds,.sig,.ttable,.rawtable{display:block;overflow-x:auto}
  .fld{grid-template-columns:minmax(0,1fr);gap:6px}
  .matrix,.kpi{grid-template-columns:minmax(0,1fr)}
  .kpi > div{border-right:0;border-bottom:1px solid var(--rule)}
  .phase{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rule{grid-template-columns:minmax(0,1fr)}
  .welcome .story h1{font-size:26px}
  .sl{grid-template-columns:minmax(0,1fr) 90px 36px}
  .num{border-right:0;border-bottom:1px solid var(--rule)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav class="side" aria-label="Screens">
  <div class="logo" aria-hidden="true">MC</div>
  <button class="nav" data-go="today"><span data-ic="home"></span>Today</button>
  <button class="nav" data-go="member"><span data-ic="user"></span>Member</button>
  <button class="nav" data-go="call"><span data-ic="phone"></span>Call</button>
  <div class="navsep">For reviewers</div>
  <button class="nav" data-go="data"><span data-ic="layers"></span>Data &amp; trust</button>
  <button class="nav" data-go="impact"><span data-ic="chart"></span>Impact</button>
  <div class="spacer"></div>
  <button class="nav" data-act="ledger"><span data-ic="saved"></span>Saved today<span class="badge" id="ledgerBadge" hidden>0</span></button>
</nav>
<div class="shell">
  <header class="top">
    <div class="brand"><b>MCheck<sup>®</sup> Handoff</b><span class="plan">Lakeshore Health Plan</span></div>
    <div class="when" id="when">Mon 9 Nov · <span class="mono">08:00</span></div>
    <button class="switch" data-act="why" aria-pressed="false" title="Show reviewer notes (W)"><i></i><span class="lbl">Show the why</span></button>
    <div class="demo" id="demo"></div>
    <button class="iconbtn" data-act="palette" aria-label="Search everything (Ctrl K)" title="Search (Ctrl K)"><span data-ic="search"></span></button>
    <button class="iconbtn" data-act="theme" aria-label="Toggle dark mode" title="Dark mode (D)"><span data-ic="moon"></span></button>
    <div class="who"><span>Maria R., RN · 48 cases</span><div class="avatar">MR</div></div>
  </header>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div id="overlay"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="prov" id="prov" hidden></div>
<div id="tour"></div>

function tm(x){
  const shift=480,prepped=10,talk=25,conv=3,coord=60,admin=45,fpc=2.5;
  const lost=x.triage+prepped*x.prep+x.failed*fpc+conv*x.doc;
  const freed=Math.max(0,shift-(lost+conv*talk+coord+admin));
  const cost=talk+x.doc+x.prep+2*fpc, added=Math.floor(freed/cost), convs=conv+added;
  const lostAfter=x.triage+x.prep*(prepped+added)+(x.failed+2*added)*fpc+x.doc*convs;
  const cap=freed/shift*97550*1.3;
  return {lost,freed,added,convs,lostAfter,over:lostAfter/convs,connect:convs/(convs+x.failed+2*added),cap,ratio:cap/6000,cost};
}
function grid(segs){ // segs: [[minutes,color]] filled into 48 ten-minute blocks
  const cells=[]; let acc=[]; segs.forEach(([m,c])=>acc.push([m,c]));
  for(let i=0;i<48;i++){ const s=i*10,e=s+10; let pos=0; const parts=[];
    for(const [m,c] of acc){ const a=pos,b=pos+m; const o=Math.max(0,Math.min(e,b)-Math.max(s,a)); if(o>0) parts.push([o,c]); pos=b; }
    if(!parts.length) cells.push('<i class="blk"></i>');
    else if(parts.length===1&&parts[0][0]>=10) cells.push(`<i class="blk" style="background:${parts[0][1]};box-shadow:none"></i>`);
    else { let p=0; const g=parts.map(([o,c])=>{const a=p;p+=o*10;return `${c} ${a}% ${p}%`}).join(','); cells.push(`<i class="blk" style="background:linear-gradient(90deg,${g},var(--surface) ${p}%);${p>=100?'box-shadow:none':''}"></i>`); }
  }
  return `<div class="blocks">${cells.join('')}</div>`;
}

    modal(`<div class="modal" role="dialog" aria-label="${a.l}">${mh(a.l,`To ${a.to} · secure fax or direct message`)}<div class="modal-b"><div class="draft">${esc(m.msgDraft)}</div><p class="muted small" style="margin-top:10px">Drafted from verified facts; each one links to its source in the sent copy. Reply expected within 48 h.</p></div>
     <div class="modal-f"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="sendMsg" data-m="${m.key}" ${sent?'disabled':''}>${sent?'Sent '+sent:'Send'}</button></div></div>`); }
  if(a.k==='book'){ const b=S.booked[m.key];
    modal(`<div class="modal" role="dialog" aria-label="${a.l}">${mh(a.l,a.what)}<div class="modal-b">${a.slots.map((s,i)=>`<label class="opt"><input type="radio" name="slot" value="${esc(s)}" ${(b?b===s.split(' · ')[0]:i===0)?'checked':''}><div><b>${esc(s.split(' · ')[0])}</b><div class="muted">${esc(s.split(' · ')[1]||'')}</div></div></label>`).join('')}<p class="muted small" style="margin-top:10px">Offered slots from a verified provider listing.</p></div>
     <div class="modal-f"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="bookSlot" data-m="${m.key}">Book</button></div></div>`); }
  if(a.k==='text'){ const consent=m.key!=='dwayne'||S.dwayneDone;
    const txt={dwayne:'Hi Dwayne, this is Maria from Lakeshore Health Plan. Your clinic visit at Eastfield is booked and a ride will pick you up. Reply STOP to opt out.',andre:'Hi Andre, this is Maria from Lakeshore Health Plan. Can I call you this afternoon, around 2–3 pm? Reply with a time that works.',gloria:'Hi Gloria, this is Maria from Lakeshore Health Plan. Could I call you this week between 4 and 4:30 pm about your diabetes medicines?'}[m.key];
    modal(`<div class="modal" role="dialog" aria-label="${a.l}">${mh(a.l,consent?'Text consent on file · sent from “Lakeshore Health Plan”':'<b style="color:var(--red)">No text consent yet.</b> Ask the ED case manager to get his consent first.')}<div class="modal-b"><div class="draft">${esc(txt)}</div><p class="muted small" style="margin-top:10px">No health details in texts. Replies land in his record.</p></div>
     <div class="modal-f"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="sendText" data-m="${m.key}" ${consent?'':'disabled'}>Send text</button></div></div>`); }
}

let palItems=[],palSel=0;
function palette(){
  modal(`<div class="modal palette" role="dialog" aria-label="Search"><input id="palIn" placeholder="Search 48 members, screens, rules, datasets…" autocomplete="off" aria-label="Search"><ul id="palList" role="listbox"></ul></div>`);

function palFill(q){
  const all=[...[['today','Today'],['member','Member'],['call','Call'],['flag','Flag review · Gloria'],['data','Data & trust'],['impact','Impact & pilot']].map(([k,l])=>({l,s:'Screen',f:()=>go(k)})),
    ...Q.map(q=>({l:q.name,s:`${q.age} · ${q.program}`,f:()=>go('member',{member:q.key||q.name})})),
    ...ANNEX.recipes.map(r=>({l:`${r[0]} · ${r[1]}`,s:'Rule',f:()=>{S.dataTab='rules';go('data')}})),
    ...ANNEX.datasets.map(d=>({l:d[1],s:`Dataset · ${d[7]}`,f:()=>{S.dataTab='datasets';S.dsel=d[0];go('data')}})),
    {l:'Guided tour',s:'Demo',f:()=>startTour()},{l:'Saved today',s:'Record',f:()=>ledgerDrawer()}];
  const t=q.toLowerCase().trim(); palItems=(t?all.filter(i=>(i.l+' '+i.s).toLowerCase().includes(t)):all.slice(0,12)).slice(0,40); palSel=0;
  document.getElementById('palList').innerHTML=palItems.map((i,n)=>`<li role="option" data-pal="${n}" aria-selected="${n===0}">${esc(i.l)}<span>${esc(i.s)}</span></li>`).join('')||'<li class="muted">No results</li>';
}

/* ============ source popover: tap or hover ============ */
const $prov=document.getElementById('prov'); let provPinned=null;
function showProv(el){
  const [src,when,state]=el.dataset.prov.split('|');
  $prov.innerHTML=`<div class="pk">${esc(state||'Source')}</div><div>${esc(src)}</div>${when?`<div class="pk" style="margin-top:6px">When</div><div>${esc(when)}</div>`:''}`;
  $prov.hidden=false; const r=el.getBoundingClientRect(),w=$prov.offsetWidth,h=$prov.offsetHeight;
  let x=Math.min(window.innerWidth-w-10,Math.max(10,r.left)), y=r.bottom+8; if(y+h>window.innerHeight-10) y=r.top-h-8;
  $prov.style.left=x+'px'; $prov.style.top=y+'px';
}
document.addEventListener('mouseover',e=>{ if(provPinned) return; const el=e.target.closest('[data-prov]'); if(el&&matchMedia('(hover:hover)').matches) showProv(el); else $prov.hidden=true; });
window.addEventListener('scroll',()=>{ $prov.hidden=true; provPinned=null; if(S.tour) placeSpot(); },{passive:true});

/* ============ guided tour (8 steps) ============ */
const TOUR=[
 {s:'today',t:'08:00',sel:'[data-tour="now"]',h:'Who first? Dwayne.',p:'He is in the ED right now after four failed calls, so he jumps the list. One call to the ED case manager reaches him.'},
 {s:'member',m:'walter',t:'08:15',sel:'[data-tour="line"]',h:'Walter: one sentence, three actions',p:'The new heart-failure drug was rejected and the stopped lisinopril was shipped home. The medicine table below shows both sides.'},
 {s:'member',m:'walter',t:'08:15',sel:'[data-tour="dock"]',h:'Confirm & start',p:'The AI read three facts from free-text notes. Nothing counts as checked until Maria confirms it.'},
 {s:'member',m:'andre',t:'08:30',sel:'[data-tour="special"]',h:'Andre: consent comes first',p:'His substance-use record exists but stays hidden until he consents. His housing answer is 8 months old, so it shows as Check.'},
 {s:'flag',t:'10:30',sel:'.vs',h:'Gloria: right member, wrong problem',p:'The risk model says non-adherent; four signals say she pays cash elsewhere. Maria asks before she coaches.'},
 {s:'member',m:'rosa',t:'11:00',sel:'[data-tour="special"]',h:'Rosa: a fall hidden under another name',p:'Two hospital records share her date of birth and plan ID. Her 15:35 call covers five things at once.'},
 {s:'call',t:'15:35',call:'rosa',sel:'[data-tour="outcome"]',h:'Every call has an outcome',p:'Reached opens the assessment: 31 of 40 answers arrive pre-filled and are confirmed a section at a time. Wrong number blocks it for everyone.'},
 {s:'impact',t:'17:00',sel:'[data-tour="kpi"]',h:'What Maria gets back',p:'Overhead per conversation falls from 100 to 33 minutes. She reaches 6 members a day instead of 3.'}];
function startTour(){ closeModal(); S.demoOpen=false; S.tour={i:0}; S.dwayneDone=false; runStep(); }
function endTour(){ S.tour=null; document.getElementById('tour').innerHTML=''; }
function runStep(){
  const st=TOUR[S.tour.i]; closeModal(); S.t=toS(st.t);
  if(st.call){ S.call.who=st.call; S.call.active=st.call; }
  go(st.s,{member:st.m});
  const el=document.querySelector(st.sel); if(el) el.scrollIntoView({block:'center',behavior:'smooth'});
  setTimeout(placeSpot,420);
  document.getElementById('tour').innerHTML=`<div class="spot" id="spot"></div><div class="tourcard" role="dialog" aria-label="Guided tour"><span class="mono muted small">Mon ${st.t}</span><h3>${st.h}</h3><p>${st.p}</p>
   <div class="f"><div class="dots">${TOUR.map((_,n)=>`<i class="${n<=S.tour.i?'on':''}"></i>`).join('')}</div><div class="row" style="flex-wrap:nowrap"><button class="btn sm ghost" data-act="tourEnd">End</button>${S.tour.i>0?'<button class="btn sm" data-act="tourPrev">Back</button>':''}<button class="btn sm primary" data-act="tourNext">${S.tour.i===TOUR.length-1?'Finish':'Next'}</button></div></div></div>`;
}
function placeSpot(){
  const sp=document.getElementById('spot'); if(!sp||!S.tour) return;
  const el=document.querySelector(TOUR[S.tour.i].sel); if(!el){sp.style.opacity=0;return;}
  const r=el.getBoundingClientRect(); sp.style.opacity=1;
  Object.assign(sp.style,{left:(r.left-6)+'px',top:(r.top-6)+'px',width:(r.width+12)+'px',height:(r.height+12)+'px'});
}
window.addEventListener('resize',()=>S.tour&&placeSpot());

/* ============ events ============ */
function resetDemo(){ location.search='?welcome=0'; }
document.addEventListener('click',e=>{
  // tap-to-show source
  const pv=e.target.closest('[data-prov]');
  if(pv&&!e.target.closest('[data-ai]')){ e.preventDefault(); if(provPinned===pv){$prov.hidden=true;provPinned=null;} else {provPinned=pv; showProv(pv);} return; }
  if(provPinned&&!e.target.closest('#prov')){ $prov.hidden=true; provPinned=null; }
  const t=e.target.closest('[data-go],[data-act],[data-member],[data-jump],[data-why],[data-qf],[data-worry],[data-ai],[data-step],[data-dt],[data-df],[data-ds],[data-rf],[data-if],[data-rule],[data-preset],[data-pal],[data-row],[data-next],[data-mact],[data-pick],[data-out],[data-sec],[data-secopen],[data-later],[data-callwho]');
  if(!t) { if(S.demoOpen&&!e.target.closest('#demo')){S.demoOpen=false;renderDemo();} return; }
  if(t.classList.contains('scrim')&&e.target!==t) return;
  const d=t.dataset;
  if(S.demoOpen&&!t.closest('#demo')){ S.demoOpen=false; renderDemo(); }
  if(d.act==='closeModal'){ closeModal(); return; }
  if(d.act==='closeDs'){ S.dsel=null; render(true); return; }
  if(d.pal!=null){ const it=palItems[+d.pal]; closeModal(); it&&it.f(); return; }
  if(d.go){ go(d.go); return; }
  if(d.member){ closeModal(); go('member',{member:d.member}); return; }
  if(d.callwho){ go('call',{who:d.callwho,active:true}); return; }
  if(d.why){ S.open[d.why]=!S.open[d.why]; render(true); return; }
  if(d.row){ const q=Q.find(x=>x.name===d.row); if(q.key==='gloria'){go('flag');return;} go('member',{member:q.key||q.name}); return; }
  if(d.next){ const k=d.next; if(k==='dwayne') dwayneModal(); else if(M[k]) go('member',{member:k}); else go('call',{who:k,active:true}); return; }
  if(d.jump){ S.t=toS(d.jump); if(d.jump==='08:00') S.dwayneDone=false; S.demoOpen=false;
    if(d.jump==='08:00'||d.jump==='11:00') go('today'); else if(d.jump==='08:15') go('member',{member:'walter'}); else go('call',{who:'rosa',active:true}); toast(`Demo clock: Mon ${d.jump}`); return; }
  if(d.qf){ S.qfilter=d.qf; S.showAll=false; render(true); return; }
  if(d.worry){ const k=S.member, old=S.worry[k]; S.worry[k]=d.worry; if(old!==d.worry) save(`${M[k].name}: how worried`,old,d.worry,'your judgment'); render(true); return; }
  if(d.ai){ const [mk,id]=d.ai.split(':'); const a=M[mk].ai.find(x=>x.id===id); if(!S.ai[d.ai]){ S.ai[d.ai]=now(); save(`${M[mk].name}: ${a.l}`,'AI-read','checked by nurse',id==='identity'?'sent for ID check':'shared with the care team'); toast(`${a.l}: confirmed`);} render(true); return; }
  if(d.step){ S.steps[d.step]=!S.steps[d.step]; render(true); return; }
  if(d.mact!=null){ const m=M[S.member], a=m.acts[+d.mact];
    if(a.k==='call'){ S.call.who=m.key; S.call.active=m.key; if(m.key==='rosa'&&S.t<toS('15:35')){S.t=toS('15:35'); toast('Demo clock: Mon 15:35, when Marisol answers');} go('call'); }
    else if(a.k==='dwayne') dwayneModal(); else if(a.k==='flag') go('flag'); else actModal(m,a); return; }
  if(d.dt){ S.dataTab=d.dt; S.dsel=null; render(); return; }
  if(d.df){ S.dfilter=d.df; render(true); return; }
  if(d.ds){ S.dsel=+d.ds; render(true); return; }
  if(d.rf){ S.rfilter=d.rf; render(true); return; }
  if(d.if){ S.ifilter=d.if; render(true); return; }
  if(d.rule){ S.dataTab='rules'; S.rfilter='all'; go('data'); setTimeout(()=>{const el=document.getElementById('rule-'+d.rule); if(el){el.scrollIntoView({block:'center'}); el.classList.add('flash');}},60); return; }
  if(d.preset){ S.tm={...PRESETS[d.preset]}; render(true); return; }
  if(d.pick){ S.call.who=d.pick; render(true); return; }
  if(d.out){ const who=S.call.active, m=M[who], r=reachOf(who); S.call.out[who]=d.out;
    const lbl={reached:'Reached',noanswer:'No answer',voicemail:'Voicemail',wrong:'Wrong number',later:'Call back later'}[d.out];
    if(d.out==='wrong'){ S.call.blockedNums=(S.call.blockedNums||[]).concat(r.num); save(`Number blocked for everyone: ${r.num}`,r.who,'wrong person','enrollment, member services, every nurse'); }
    else save(`${m?m.name:who}: call attempt`,null,`${lbl} · ${r.num}`,'call log','log');
    render(true); return; }
  if(d.sec){ const k=d.sec; S.call.sec[k]=!S.call.sec[k]; if(S.call.sec[k]) toast(`${k}: ${fieldsOf(k).filter(f=>f[6]!=='Y').length} answers confirmed`); render(true); return; }
  if(d.secopen){ S.call.open=S.call.open||{}; S.call.open[d.secopen]=!S.call.open[d.secopen]; render(true); return; }
  if(d.later){ const who=S.call.active; S.call.later[who]=d.later; save(`${M[who]?M[who].name:who}: callback`,null,d.later,'your task list','task'); toast(`Callback set: ${d.later}`); render(true); return; }
  switch(d.act){
    case 'why': S.why=!S.why; render(true); toast(S.why?'Showing reviewer notes':'Reviewer notes hidden'); break;
    case 'demo': S.demoOpen=!S.demoOpen; renderDemo(); break;
    case 'tour': S.tour?endTour():startTour(); break;
    case 'tourStart': startTour(); break;
    case 'tourEnd': endTour(); break;
    case 'tourNext': if(S.tour.i<TOUR.length-1){S.tour.i++;runStep();}else{endTour();toast('Tour complete. Everything stays clickable.');} break;
    case 'tourPrev': if(S.tour.i>0){S.tour.i--;runStep();} break;
    case 'reset': resetDemo(); break;
    case 'palette': palette(); break;
    case 'ledger': ledgerDrawer(); break;
    case 'tipOk': try{localStorage.setItem('mc-tip','1')}catch(err){} render(true); break;
    case 'theme': { const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); const nx=cur==='dark'?'light':'dark'; document.documentElement.dataset.theme=nx; try{localStorage.setItem('mc-theme',nx)}catch(err){} break; }
    case 'moreChips': S.moreChips=!S.moreChips; render(true); break;
    case 'numOpen': S.numOpen=!S.numOpen; render(true); break;
    case 'overAll': S.overAll=!S.overAll; render(true); break;
    case 'showAll': S.showAll=true; render(true); break;
    case 'showLess': S.showAll=false; render(true); break;
    case 'loadOpen': S.loadOpen=!S.loadOpen; render(true); break;
    case 'rebalance': { S.rebalanced=now(); const lp=loadPlan(); lp.pulled.forEach(q=>save(`${q.name}: call moved`,q.due,'Mon/Tue spare slot','supervisor approved','route')); [lp.floatW,lp.floatT].forEach(q=>save(`${q.name}: call routed`,'Maria','float nurse (Ohio licence, language checked)','supervisor approved','route')); render(true); toast('Week balanced: every day at or under 6'); break; }
    case 'undoLoad': S.rebalanced=false; S.loadOpen=false; render(true); break;
    case 'callDwayne': dwayneModal(); break;
    case 'saveDwayne': { if(S.t<toS('08:04')) S.t=toS('08:04'); S.dwayneAt=now(); const ck=k=>$ov.querySelector(`[data-dw="${k}"]`).checked;
      if(ck('num')) save('Dwayne Pruitt: phone','(614) 555-0115','(614) 555-0119','enrollment, member services, next nurse');
      if(ck('sms')) save('Dwayne Pruitt: text consent','none','yes','consent record');
      if(ck('inh')) save('Dwayne Pruitt: controller inhaler','130-day gap','starter given at ED discharge','case record');
      if(ck('fqhc')) save('Dwayne Pruitt: primary care','doctor who left in August','Eastfield clinic + ride booked','enrollment, provider directory');
      S.dwayneDone=true; S.reached.add('dwayne'); closeModal(); render(true); toast('Call saved · Dwayne’s record updated'); break; }
    case 'openRosa': S.call.who='rosa'; S.call.active='rosa'; if(S.t<toS('15:35')){S.t=toS('15:35'); toast('Demo clock: Mon 15:35, when Marisol answers');} go('call'); break;
    case 'confirmStart': { const m=M[S.member]; if(m.ai.every(a=>S.ai[m.key+':'+a.id])){ S.started[m.key]=now(); render(true); toast('Started · saved to the record'); } else confirmModal(m); break; }
    case 'confirmAll': { const m=M[d.m]; m.ai.forEach(a=>{const k=m.key+':'+a.id; if(!S.ai[k]){S.ai[k]=now(); save(`${m.name}: ${a.l}`,'AI-read','checked by nurse','shared with the care team');}}); S.started[m.key]=now(); closeModal(); render(true); toast(`${m.name.split(' ')[0]}: ${m.ai.length} facts confirmed and saved`); break; }
    case 'sendMsg': { const m=M[d.m]; S.sent[m.key]=now(); save(`${m.name}: message to prescriber`,null,'sent · reply expected in 48 h','prescriber + case record'); closeModal(); render(true); toast('Sent · reply clock started (48 h)'); break; }
    case 'bookSlot': { const m=M[d.m]; const v=$ov.querySelector('input[name=slot]:checked').value; S.booked[m.key]=v.split(' · ')[0]; save(`${m.name}: appointment`,'none found',v,'case record'); closeModal(); render(true); toast('Booked · “Missing” is now “Verified”'); break; }
    case 'sendText': { const m=M[d.m]; save(`${m.name}: text sent`,null,'from “Lakeshore Health Plan”','call log','log'); closeModal(); toast('Text sent'); break; }
    case 'keepFlag': keepFlagModal(); break;
    case 'keepFlagSave': { const r=$ov.querySelector('input[name=kr]:checked').value; S.flag='kept'; save('Gloria Mensah: “non-adherent” flag kept','downgraded','kept · '+r,'reviewed monthly','override'); closeModal(); render(true); toast('Kept · your reason is saved'); break; }
    case 'acceptFlag': S.flag='accepted'; S.tasks=['Text Gloria; call 16:00–16:30: ask where she fills metformin','Dr. Nair: appeal the denial with the evidence (by 26 Dec)','Book a diabetes visit (A1c 9.2%)']; S.tasks.forEach(t=>save('Gloria Mensah: task added',null,t,'this week','task')); render(true); toast('Agreed · 3 tasks added to this week'); break;
    case 'flagReset': S.flag=null; S.tasks=[]; render(true); break;
    case 'pickAgain': S.call.active=null; render(); break;
    case 'startCall': { const w=S.call.who; if(w==='dwayne'){ if(!S.dwayneDone) dwayneModal(); else toast('Dwayne was reached at '+S.dwayneAt); break; } if(w==='rosa'&&S.t<toS('15:35')){S.t=toS('15:35'); toast('Demo clock: Mon 15:35, when Marisol answers');} S.call.active=w; render(); break; }
    case 'schedNext': { const who=S.call.active, m=M[who], r=reachOf(who); save(`${m?m.name:who}: next try`,null,r.next,'your task list','task'); toast('Next try scheduled'); break; }
    case 'sample': Object.assign(S.call.j,A_SAMPLE); S.demoOpen=false; render(true); toast('Sample answers filled'); break;
    case 'draftCall': toast('Draft saved · nothing shared yet'); break;
    case 'saveSimple': { const who=S.call.active; S.reached.add(who); save(`${M[who]?M[who].name:who}: call saved`,null,'reached · next steps logged','case record'); render(true); toast('Saved · progress updated'); break; }
    case 'saveCall': { S.call.saved=true; S.reached.add('rosa');
      [['Rosa Delgado: language','blank','Spanish, interpreter needed','enrollment'],['Rosa Delgado: best contact','landline (614) 555-0186','Marisol (614) 555-0187, 15:30–17:00','phone list'],['Rosa Delgado: falls in the past year','0','2','annual assessment, case record'],['Rosa Delgado: authorisation renewal','ends 30 Nov','form sent by text','consent record'],['Rosa Delgado: “Delgado-Ruiz” records','possible match','sent for ID check','member records']].forEach(a=>save(...a));
      render(true); toast('Saved · 4 facts updated, 1 sent for ID check'); break; }
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.item!=null){ S.call.items[t.dataset.item]=t.checked; render(true); return; }
  if(t.dataset.chk!=null){ const w=S.call.active; S.call.checks[w]=S.call.checks[w]||{}; S.call.checks[w][t.dataset.chk]=t.checked; render(true); return; }
  if(t.dataset.j){ S.call.j[t.dataset.j]=t.value; render(true); return; }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='qsearch'){ S.qsearch=t.value; const p=t.selectionStart; render(true); const n=document.getElementById('qsearch'); n.focus(); n.setSelectionRange(p,p); return; }
  if(t.dataset.tm){ S.tm[t.dataset.tm]=+t.value; const id=t.id; render(true); const n=document.getElementById(id); n&&n.focus(); }
});
let qSel=-1;
document.addEventListener('keydown',e=>{
  const typing=/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); palette(); return; }
  if(e.key==='Escape'){ $prov.hidden=true; provPinned=null; if(S.dsel){S.dsel=null;render(true);} if(S.demoOpen){S.demoOpen=false;renderDemo();} if($ov.innerHTML) closeModal(); else if(S.tour) endTour(); return; }
  const pal=document.getElementById('palList');
  if(pal){ if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); palSel=Math.max(0,Math.min(palItems.length-1,palSel+(e.key==='ArrowDown'?1:-1))); pal.querySelectorAll('li').forEach((l,i)=>l.setAttribute('aria-selected',String(i===palSel))); pal.children[palSel]&&pal.children[palSel].scrollIntoView({block:'nearest'}); } else if(e.key==='Enter'){ const it=palItems[palSel]; closeModal(); it&&it.f(); } return; }
  if(typing||$ov.innerHTML) return;
  if(S.tour&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){ e.preventDefault(); document.querySelector(`[data-act="${e.key==='ArrowRight'?'tourNext':'tourPrev'}"]`)?.click(); return; }
  const k=e.key.toLowerCase();
  const scr={1:'today',2:'member',3:'call',4:'data',5:'impact'}[e.key]; if(scr){ go(scr); return; }
  if(k==='w'){ document.querySelector('[data-act="why"]').click(); return; }
  if(k==='t'){ S.tour?endTour():startTour(); return; }
  if(k==='d'){ document.querySelector('[data-act="theme"]').click(); return; }
  if(e.key==='?'){ helpModal(); return; }
  if(S.screen==='today'&&(k==='j'||k==='k')){ const rows=[...document.querySelectorAll('tr.r')]; if(!rows.length) return; qSel=Math.max(0,Math.min(rows.length-1,qSel+(k==='j'?1:-1))); rows.forEach(r=>r.classList.remove('sel')); rows[qSel].classList.add('sel'); rows[qSel].focus(); return; }
  if(e.key==='Enter'&&document.activeElement.dataset&&document.activeElement.dataset.row){ document.activeElement.click(); }
});

/* boot */
render();
const params=new URLSearchParams(location.search);
let seen=false; try{seen=localStorage.getItem('mc-welcome')==='1'; localStorage.setItem('mc-welcome','1');}catch(e){}
if(params.get('tour')==='1') startTour(); else if(params.get('welcome')!=='0'&&(!seen||params.get('welcome')==='1')) welcome();
</script>
