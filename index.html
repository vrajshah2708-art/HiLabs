<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCheck Handoff Prototype</title>
<meta name="description" content="Working prototype of MCheck® Handoff, a case management workbench MVP: clock-driven queue, I-PASS member handoff, call-and-confirm documentation. All patient data is fictional.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#072669;--blue:#2A6AF1;--blue-ink:#1F57D6;--tint:#EAF0FE;--ink:#141B26;--muted:#5A6884;--faint:#8D97AA;
  --rule:#DDE2EA;--panel:#F4F6FA;--surface:#FFFFFF;--canvas:#F4F6FA;--head:#072669;--side:#072669;
  --red:#B8322B;--redt:#FBECEA;--redfill:#B8322B;--green:#0D7553;--greent:#E2F3EC;--amber:#8F5B00;--ambert:#FDF3DE;
  --plum:#7A3B97;--plumt:#F4ECF8;--grey:#5A6884;--greyt:#EEF0F4;--bar:#2A6AF1;--scrim:rgba(7,18,46,.55);
  --pop:0 12px 32px rgba(7,38,105,.16),0 2px 6px rgba(7,38,105,.08);--blk-other:#C9CFDA;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#3D63C9;--blue:#6B95FF;--blue-ink:#8FB0FF;--tint:#1A2A4D;--ink:#E7ECF5;--muted:#A3AFC4;--faint:#6F7B92;
    --rule:#2A3449;--panel:#1B2333;--surface:#151C2A;--canvas:#0D1220;--head:#B5C9FF;--side:#0A1433;
    --red:#F07A70;--redt:#3A1F22;--green:#5CCB9E;--greent:#123329;--amber:#E9B654;--ambert:#352A12;
    --plum:#CFA2E6;--plumt:#2E2140;--grey:#A3AFC4;--greyt:#232C3D;--bar:#6B95FF;--scrim:rgba(0,0,0,.6);
    --pop:0 12px 32px rgba(0,0,0,.5);--blk-other:#3A4458;
  }
}
:root[data-theme="dark"]{
    --navy:#3D63C9;--blue:#6B95FF;--blue-ink:#8FB0FF;--tint:#1A2A4D;--ink:#E7ECF5;--muted:#A3AFC4;--faint:#6F7B92;
    --rule:#2A3449;--panel:#1B2333;--surface:#151C2A;--canvas:#0D1220;--head:#B5C9FF;--side:#0A1433;
    --red:#F07A70;--redt:#3A1F22;--green:#5CCB9E;--greent:#123329;--amber:#E9B654;--ambert:#352A12;
    --plum:#CFA2E6;--plumt:#2E2140;--grey:#A3AFC4;--greyt:#232C3D;--bar:#6B95FF;--scrim:rgba(0,0,0,.6);
    --pop:0 12px 32px rgba(0,0,0,.5);--blk-other:#3A4458;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.45 var(--sans);font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue-ink)}
.mono{font-family:var(--mono);font-feature-settings:normal}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:13px}
.xs{font-size:12px}
h1,h2,h3{margin:0;color:var(--head);font-weight:600;letter-spacing:-.005em}
h1{font-size:26px;line-height:1.2}
h2{font-size:18px;line-height:1.3}
h3{font-size:15px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:72px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;z-index:30}
.logo{width:42px;height:42px;border-radius:10px;background:#fff;color:#072669;display:grid;place-items:center;font:700 15px var(--sans);margin-bottom:14px;letter-spacing:-.02em}
.nav{width:72px;height:52px;display:grid;place-items:center;border:0;background:none;color:#B9C7EA;position:relative}
.nav:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav[aria-current="true"]{color:#fff}
.nav[aria-current="true"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:#fff;border-radius:0 3px 3px 0}
.nav .tip{position:absolute;left:66px;background:#0B1638;color:#fff;font-size:12px;white-space:nowrap;padding:5px 9px;border-radius:6px;opacity:0;pointer-events:none;transform:translateX(-4px);transition:.12s}
.nav:hover .tip,.nav:focus-visible .tip{opacity:1;transform:none}
.nav .badge{position:absolute;top:9px;right:16px;background:#B8322B;color:#fff;font:600 10px var(--mono);border-radius:8px;padding:1px 5px}
.side .spacer{flex:1}

.top{position:sticky;top:0;z-index:25;height:62px;background:var(--surface);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:14px;padding:0 24px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{color:var(--head);font-size:18px;font-weight:600;white-space:nowrap}
.brand b sup{font-size:9px}
.brand span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clockbox{margin:0 auto;display:flex;align-items:center;gap:8px}
.simclock{font:500 16px var(--mono);color:var(--ink);white-space:nowrap}
.simclock .sec{color:var(--faint)}
.dshort{display:none}
.jump{display:flex;gap:2px;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:2px}
.jump button{border:0;background:none;padding:4px 8px;border-radius:6px;font:500 12px var(--mono);color:var(--muted)}
.jump button:hover{color:var(--ink);background:var(--surface)}
.jump button[aria-pressed="true"]{background:var(--surface);color:var(--blue-ink);box-shadow:0 0 0 1px var(--rule)}
.iconbtn{border:1px solid var(--rule);background:var(--surface);height:34px;min-width:34px;border-radius:8px;display:inline-grid;place-items:center;color:var(--muted);padding:0 8px}
.iconbtn:hover{color:var(--ink);border-color:var(--faint)}
.who{display:flex;align-items:center;gap:10px;color:var(--muted);white-space:nowrap}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--tint);color:var(--blue-ink);display:grid;place-items:center;font-weight:600;font-size:13px}
.main{padding:22px 28px 140px;max-width:1560px;margin:0 auto;width:100%}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:#2A6AF1;border-color:#2A6AF1;color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.primary[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{height:30px;padding:0 11px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--blue-ink)}
.btn.ghost:hover{background:var(--tint)}
.link{border:0;background:none;color:var(--blue-ink);padding:0;font-weight:500}
.link:hover{text-decoration:underline}

/* ---------- chips & tags ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:3px 10px;border-radius:13px;font-size:13px;font-weight:500;line-height:1.3;background:var(--greyt);color:var(--grey);vertical-align:middle;text-align:left}
.chip svg{flex:none}
.chip.ok{background:var(--greent);color:var(--green)}
.chip.confirm{background:var(--ambert);color:var(--amber)}
.chip.conflict{background:var(--plumt);color:var(--plum)}
.chip.expected{background:var(--tint);color:var(--blue-ink)}
.chip.unknown{background:var(--greyt);color:var(--grey)}
.chip.line{background:var(--surface);border:1px solid var(--rule);color:var(--ink)}
.chip.line svg{color:var(--green)}
.chip.line.c svg{color:var(--amber)}
.chip.line.p svg{color:var(--plum)}
.chip.line.e svg{color:var(--blue-ink)}
.chip.judg{background:var(--tint);color:var(--blue-ink)}
.chip.star{background:none;border:1px solid var(--head);color:var(--head);border-radius:6px;min-height:22px;padding:1px 8px;font-size:12px}
.chip.tiny{min-height:20px;padding:1px 8px;font-size:12px}
.chip[data-prov]{cursor:help}
button.chip{border:0}
button.chip:hover{filter:brightness(.97)}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--redfill);color:#fff;border-radius:5px;padding:3px 9px;font-size:13px;font-weight:600;white-space:nowrap;vertical-align:middle}
.tag.soft{background:var(--redt);color:var(--red)}
.pin{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font:600 12px var(--mono);flex:none}
.pin.o{background:var(--surface);color:var(--head);border:1.5px solid var(--head)}
.kbd{font:500 11px var(--mono);border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--muted);background:var(--surface)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 20px 10px}
.card-h p{margin:2px 0 0;color:var(--muted);font-size:13px}
.card-h .chip,.wb .chip{white-space:nowrap}
.ba .t,.ba .h{white-space:nowrap;padding:2px 6px}
.card-b{padding:6px 20px 18px}
.grid-main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.stack{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.stack > *{min-width:0}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.mrow span:first-child{min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hr{height:1px;background:var(--rule);margin:12px 0}
.eyebrow{font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase}
.page-h{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap}
.page-h p{margin:6px 0 0;color:var(--muted);max-width:760px}
.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end;max-width:620px}
.legend .lbl{color:var(--muted);font-size:13px;margin:0 2px 0 8px}

/* ---------- queue ---------- */
.now{border-left:4px solid var(--redfill);background:linear-gradient(0deg,var(--surface),var(--surface));position:relative}
.now .wash{background:var(--redt);opacity:.35;position:absolute;inset:0;border-radius:12px;pointer-events:none}
.now > *{position:relative}
.now-top{display:flex;justify-content:space-between;gap:16px;padding:18px 22px 6px;flex-wrap:wrap}
.timer{font:600 30px var(--mono);color:var(--red);line-height:1}
.numtable{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.numtable th{font-weight:500;color:var(--muted);text-align:left;padding:8px 12px;background:var(--panel);font-size:13px}
.numtable td{padding:10px 12px;border-top:1px solid var(--rule);vertical-align:top}
.strike{text-decoration:line-through;color:var(--faint)}
.sched{border-left:4px solid var(--blue);display:grid;grid-template-columns:150px 1fr auto;gap:16px;padding:14px 20px;align-items:center}
.bigtime{font:600 28px var(--mono);color:var(--head);line-height:1}
.qtable{width:100%;border-collapse:collapse}
.qtable th{font-size:13px;font-weight:500;color:var(--muted);text-align:left;padding:10px 12px;background:var(--panel);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);white-space:nowrap}
.qtable td{padding:13px 12px;border-bottom:1px solid var(--rule);vertical-align:top;font-size:14px}
.qtable tr.qrow{cursor:pointer}
.qtable tr.qrow:hover td{background:var(--panel)}
.qtable tr.qrow.sel td{background:var(--tint)}
.qtable tr.qrow.annex td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
.qtable .nm{font-weight:600;color:var(--ink)}
.qtable .sub{color:var(--muted);font-size:13px}
.whychips{display:flex;flex-direction:column;gap:5px;align-items:flex-start;min-width:200px}
.whychips .chip{white-space:nowrap}
.numtable td.mono{white-space:nowrap}
.scorebar{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.scorebar .track{width:64px;height:6px;border-radius:3px;background:var(--greyt);overflow:hidden}
.scorebar .fill{height:100%;background:var(--head)}
.scorebar b{font:600 15px var(--mono);min-width:26px;text-align:right}
.why{background:var(--panel)}
.why td{padding:0!important;border-bottom:1px solid var(--rule)}
.whybox{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:14px 18px 16px 48px}
.whybox .f{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
.whybox .f .k{font:600 20px var(--mono);color:var(--head)}
.whybox .f .l{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid transparent;background:none;border-radius:16px;padding:4px 12px;font-size:13px;color:var(--muted);font-weight:500}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--tint);color:var(--blue-ink);border-color:transparent}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:8px;padding:0 10px;height:34px;background:var(--surface);color:var(--muted)}
.search input{border:0;outline:0;background:none;width:170px;color:var(--ink)}
.done-item{padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.done-item:last-child{border-bottom:0}
.done-item .chip{margin-right:6px}
.bars{display:flex;align-items:flex-end;gap:14px;height:150px;padding:18px 4px 0;position:relative}
.bars .cap{position:absolute;left:0;right:0;border-top:1.5px dashed var(--faint)}
.bars .cap span{position:absolute;right:0;top:-18px;font:12px var(--mono);color:var(--faint)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%}
.bar .stackb{width:100%;max-width:38px;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden;transition:height .5s}
.bar .seg{width:100%;transition:height .5s}
.bar .v{font:600 13px var(--mono)}
.bar .d{font-size:12px;color:var(--muted)}
.callout{border-radius:8px;padding:10px 12px;font-size:13.5px}
.callout.red{background:var(--redt)}
.callout.blue{background:var(--tint)}
.callout.green{background:var(--greent)}
.callout.amber{background:var(--ambert)}
.thisweek{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 20px}

/* ---------- member ---------- */
.mtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.mtab{border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:8px 12px;text-align:left;display:flex;gap:10px;align-items:center;min-width:0}
.mtab:hover{border-color:var(--faint)}
.mtab[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.mtab b{display:block;font-size:14px}
.mtab span{display:block;font-size:12px;color:var(--muted)}
.mtab .dot{width:8px;height:8px;border-radius:50%;flex:none}
.mhead{padding:20px 24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px}
.mhead h1{font-size:28px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.mhead h1 small{font:400 14px var(--sans);color:var(--muted)}
.sev{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.sevsel{display:flex;gap:2px;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:2px}
.sevsel button{border:0;background:none;border-radius:6px;padding:6px 12px;font-weight:600;font-size:14px;color:var(--muted)}
.sevsel button[aria-pressed="true"][data-v="Stable"]{background:var(--greent);color:var(--green)}
.sevsel button[aria-pressed="true"][data-v="Watcher"]{background:var(--ambert);color:var(--amber)}
.sevsel button[aria-pressed="true"][data-v="Unstable"]{background:var(--redfill);color:#fff}
.timeline{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:0;position:relative;overflow-x:auto;padding:4px 2px 6px}
.tl{position:relative;padding:22px 14px 0 0}
.tl::before{content:"";position:absolute;top:8px;left:0;right:0;height:2px;background:var(--rule)}
.tl:last-child::before{right:auto;width:30px}
.tl .node{position:absolute;top:1px;left:0;width:16px;height:16px;border-radius:50%;border:2px solid var(--faint);background:var(--surface)}
.tl .node::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--faint)}
.tl.risk .node{border-color:var(--red)}.tl.risk .node::after{background:var(--red)}
.tl.cur .node{border-color:var(--head)}.tl.cur .node::after{background:var(--head)}
.tl .when{font:12px var(--mono);color:var(--muted);display:block;margin:2px 0 3px}
.tl .what{font-size:13.5px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.fact{padding:14px 18px;border-right:1px solid var(--rule)}
.fact:last-child{border-right:0}
.fact .l{font-size:13px;color:var(--muted)}
.fact .v{font:600 18px var(--mono);margin:4px 0 2px}
.fact .v.warn{color:var(--amber)}
.fact .v.bad{color:var(--red)}
.fact .s{font:11.5px/1.45 var(--mono);color:var(--faint)}
.medtable{width:100%;border-collapse:collapse;font-size:14px}
.medtable th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:9px 14px;border-bottom:1px solid var(--rule);background:var(--panel)}
.medtable td{padding:12px 14px;border-bottom:1px solid var(--rule);vertical-align:top}
.medtable tr:last-child td{border-bottom:0}
.medtable td.note{color:var(--muted);font-size:13px}
.actions{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.actions li{display:grid;grid-template-columns:28px 1fr;gap:10px}
.actions li .pin{width:26px;height:26px;font-size:13px;cursor:pointer;border:0}
.actions li.done .pin{background:var(--green)}
.actions li.done b{text-decoration:line-through;color:var(--muted)}
.actions li b{display:block;font-size:14.5px}
.actions li span{color:var(--muted);font-size:13.5px}
.sit{display:grid;gap:9px;font-size:14px}
.sticky{position:sticky;bottom:0;z-index:15;margin-top:18px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.sticky b{color:var(--head)}
.aifacts{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.rawtable{width:100%;border-collapse:collapse;font:12.5px var(--mono)}
.rawtable th{text-align:left;color:var(--muted);font-weight:500;padding:6px 10px;border-bottom:1px solid var(--head)}
.rawtable td{padding:6px 10px;border-bottom:1px solid var(--rule)}
.rawtable td.bad{background:var(--redt);color:var(--red)}
.rawtable td.good{background:var(--greent);color:var(--green)}
.imp{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.imp:last-child{border-bottom:0}
.imp .n{font:600 12px var(--mono);color:var(--muted);padding-top:2px}
.details{border-top:1px solid var(--rule)}
.details summary{list-style:none;cursor:pointer;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;color:var(--head);font-weight:600}
.details summary::-webkit-details-marker{display:none}
.details[open] summary .chev{transform:rotate(180deg)}
.chev{transition:.15s}

/* ---------- call ---------- */
.callhead{display:grid;grid-template-columns:auto 1fr auto;gap:24px;padding:16px 22px;border-left:4px solid var(--green);align-items:center}
.callhead .incall{font:600 30px var(--mono);color:var(--green);line-height:1.1}
.call-grid{display:grid;grid-template-columns:290px minmax(0,1fr) 330px;gap:18px;align-items:start}
.items{display:grid;gap:0}
.item{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:13px 0;border-bottom:1px solid var(--rule)}
.item:last-child{border-bottom:0}
.item input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--green)}
.item b{font-size:14.5px}
.item p{margin:2px 0 6px;color:var(--muted);font-size:13.5px}
.atable{width:100%;border-collapse:collapse;font-size:14px}
.atable th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:9px 12px;background:var(--panel);border-bottom:1px solid var(--rule)}
.atable td{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
.atable td.src{font:12px/1.45 var(--mono);color:var(--faint);max-width:200px}
.atable tr.sec td{background:var(--panel);font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:7px 12px}
.atable .q{font-weight:500}
.atable .cue{font:12px var(--mono);color:var(--faint);margin-top:4px}
.jin{width:100%;min-width:140px;border:1.5px dashed var(--blue);border-radius:6px;background:var(--surface);padding:6px 8px;font-size:14px}
.jin:focus{outline:0;border-style:solid}
.jin.filled{border-style:solid;border-color:var(--rule)}
.rcheck{border:1px solid var(--rule);background:var(--surface);border-radius:6px;width:26px;height:26px;display:grid;place-items:center;color:var(--faint);padding:0}
.rcheck[aria-pressed="true"]{background:var(--greent);border-color:transparent;color:var(--green)}
.notedraft{border:1px solid var(--rule);border-radius:8px;padding:14px 16px;font-size:14px;line-height:1.65;background:var(--panel)}
.notedraft .br{background:var(--ambert);color:var(--amber);border-radius:4px;padding:0 4px;font-weight:600}
.notedraft .fill{background:var(--greent);color:var(--green);border-radius:4px;padding:0 4px;font-weight:500}
.notedraft .srcl{font:12px var(--mono);color:var(--faint);display:block;margin-top:10px}
.wb{display:grid;gap:8px;font-size:14px}
.wb > div{display:flex;gap:8px;align-items:flex-start}
.ba{width:100%;border-collapse:collapse;font-size:14px}
.ba td,.ba th{padding:8px 10px;border-bottom:1px solid var(--rule);text-align:left}
.ba th{font-weight:500;color:var(--muted);font-size:13px}
.ba .t{background:var(--redt);color:var(--red);font:600 13px var(--mono);text-align:center;border-radius:4px}
.ba .h{background:var(--greent);color:var(--green);font:600 13px var(--mono);text-align:center;border-radius:4px}
.progress{height:6px;background:var(--greyt);border-radius:3px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--green);transition:width .3s}

/* ---------- flag ---------- */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.vs .box{border:1px solid var(--rule);border-radius:10px;padding:16px 18px}
.vs .box.win{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.vs .box .l{color:var(--muted);font-size:13px}
.vs .box b{display:block;font-size:17px;margin:4px 0 6px;line-height:1.35}
.sig{width:100%;border-collapse:collapse;font-size:14px}
.sig th{text-align:left;color:var(--muted);font-weight:500;font-size:13px;padding:9px 12px;background:var(--panel)}
.sig td{padding:12px;border-bottom:1px solid var(--rule);vertical-align:top}
.sig td.s{font:12.5px var(--mono);color:var(--faint)}

/* ---------- data ---------- */
.dgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;align-items:start}
.dcol{background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.dcol-h{background:var(--navy);color:#fff;padding:12px 14px}
.dcol-h .k{font:500 12px var(--mono);color:#B9C9F3}
.dcol-h b{display:block;font-size:15px;margin-top:2px}
.dcol-b{padding:10px;display:grid;gap:8px}
.dtile{border:1px solid var(--rule);border-left:3px solid var(--green);border-radius:6px;padding:9px 10px;text-align:left;background:var(--panel);width:100%}
.dtile:hover{border-color:var(--faint);border-left-color:var(--green)}
.dtile.lite{border:1px dashed var(--amber);border-left:1px dashed var(--amber);background:var(--surface)}
.dtile.later{border:1px solid var(--rule);border-left:3px solid var(--faint);background:var(--surface);opacity:.8}
.dtile b{display:block;font-size:13.5px;line-height:1.3}
.dtile span{display:block;font:11.5px/1.4 var(--mono);color:var(--muted);margin-top:3px}
.dtile.dim{opacity:.25}
.recipe{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;padding:14px 18px;border-bottom:1px solid var(--rule);align-items:start}
.recipe:last-child{border-bottom:0}
.recipe .id{font:600 14px var(--mono);color:var(--head)}
.recipe .eq{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.recipe .in{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:2px 9px}
.recipe .op{color:var(--muted);font:600 13px var(--mono)}
.recipe .out{background:var(--redt);color:var(--red);border-radius:12px;padding:2px 9px;font-weight:500}
.recipe .act{font-weight:600}
.matrix{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.matrix .mc h3{padding:8px 10px;border-radius:6px;font-size:14px}
.matrix .mc div{padding:8px 10px;border-bottom:1px solid var(--rule);font-size:14px}
.dclock{display:grid;gap:0;position:relative;padding-left:12px}
.dclock .s{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:10px 0;border-left:2px solid var(--head);padding-left:16px;margin-left:0}
.dclock .s.hot{border-left-color:var(--red)}
.dclock .s .k{font:600 14px var(--mono);color:var(--head)}
.dclock .s.hot .k{color:var(--red)}
.ttable{width:100%;border-collapse:collapse;font-size:13.5px}
.ttable th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--rule)}
.ttable td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}

/* ---------- impact ---------- */
.blocks{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;max-width:330px}
.blk{aspect-ratio:1;border-radius:4px;background:var(--greyt);transition:background .35s}
.blk.lost{background:#D46F68}
.blk.talk{background:var(--blue)}
.blk.other{background:var(--blk-other)}
.blk.free{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--green)}
.sl{display:grid;grid-template-columns:minmax(0,1fr) 120px 52px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.sl input[type=range]{width:100%;accent-color:var(--blue)}
.sl output{font:600 14px var(--mono);text-align:right}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--rule);border-radius:12px;background:var(--surface);overflow:hidden}
.kpi > div{padding:16px 18px;border-right:1px solid var(--rule)}
.kpi > div:last-child{border-right:0}
.kpi .v{font:600 30px var(--mono);color:var(--head);line-height:1.1}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:500}
.kpi .l{font-size:13px;color:var(--muted);margin-top:4px}
.mtree{display:grid;gap:8px}
.mtree .ns{background:var(--navy);color:#fff;border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.mtree .ns b{font:600 28px var(--mono);white-space:nowrap}
.mrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:14px}
.mrow span:last-child{font:500 13.5px var(--mono);white-space:nowrap}
.guard{border:1.5px dashed var(--red);border-radius:10px;padding:10px 14px;font-size:13.5px}
.phase{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.phase > div{border-top:3px solid var(--blue);padding-top:8px;font-size:13.5px}
.phase > div:first-child{border-top-color:var(--navy)}
.phase b{display:block;font:600 12px var(--mono);color:var(--muted)}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:80;display:grid;place-items:center;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:14px;width:min(640px,100%);max-height:calc(100vh - 40px);overflow:auto;box-shadow:var(--pop);animation:rise .18s}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
.modal-h{padding:20px 24px 8px;display:flex;justify-content:space-between;gap:12px}
.modal-b{padding:8px 24px 18px}
.modal-f{padding:14px 24px;border-top:1px solid var(--rule);display:flex;justify-content:flex-end;gap:10px;align-items:center;flex-wrap:wrap}
.check{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--green);margin:1px 0 0}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:85;box-shadow:var(--pop);display:flex;flex-direction:column;animation:slide .2s}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.drawer-h{padding:18px 22px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.drawer-b{padding:8px 22px 24px;overflow:auto;flex:1}
.ledger{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--rule);font-size:14px}
.ledger .t{font:500 12.5px var(--mono);color:var(--muted);padding-top:2px}
.ledger .ft{font:12.5px var(--mono);color:var(--muted);margin-top:4px}
.ledger .ft s{color:var(--faint)}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:95;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{background:#0B1638;color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:var(--pop);animation:rise .2s;pointer-events:auto;max-width:min(560px,90vw)}
.toast svg{color:#7FE0B5;flex:none}
.prov{position:fixed;z-index:99;background:#0B1638;color:#E9EEFA;border-radius:8px;padding:10px 12px;font-size:12.5px;max-width:320px;pointer-events:none;box-shadow:var(--pop);line-height:1.5}
.prov .pk{font:500 11px var(--mono);color:#8FA6D8;text-transform:uppercase;letter-spacing:.05em}
.prov .pv{font-family:var(--mono)}
.palette{width:min(620px,100%);align-self:start;margin-top:10vh}
.palette input{width:100%;border:0;border-bottom:1px solid var(--rule);padding:16px 20px;font-size:16px;background:none;outline:0}
.palette ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.palette li{padding:9px 14px;border-radius:8px;display:flex;justify-content:space-between;gap:10px;cursor:pointer;font-size:14px}
.palette li[aria-selected="true"]{background:var(--tint);color:var(--blue-ink)}
.palette li span{color:var(--muted);font-size:12.5px}

/* tour */
.spot{position:fixed;z-index:70;border-radius:12px;box-shadow:0 0 0 3px var(--blue),0 0 0 9999px rgba(7,18,46,.42);pointer-events:none;transition:all .35s cubic-bezier(.2,.8,.2,1)}
.tourcard{position:fixed;z-index:90;right:22px;bottom:22px;width:min(400px,calc(100vw - 32px));background:var(--surface);border-radius:14px;box-shadow:var(--pop);border:1px solid var(--rule);animation:rise .2s}
.tourcard .tc-h{padding:14px 18px 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tourcard .tc-b{padding:4px 18px 12px}
.tourcard .tc-b h3{font-size:16px;margin:4px 0 6px}
.tourcard .tc-b p{margin:0;font-size:14px;color:var(--ink)}
.tourcard .tc-f{padding:10px 18px 14px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.dots{display:flex;gap:3px;flex-wrap:wrap;max-width:190px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--rule)}
.dots i.on{background:var(--blue)}
.stamp{font:600 13px var(--mono);color:var(--blue-ink)}
.slide{font:500 11.5px var(--mono);color:var(--muted);border:1px solid var(--rule);border-radius:10px;padding:1px 8px}

/* welcome */
.welcome{width:min(980px,100%);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);overflow:hidden;padding:0}
.welcome > div{min-width:0}
.welcome .l{background:linear-gradient(135deg,#092255,#2B1F77);color:#fff;padding:34px 34px 28px;display:flex;flex-direction:column;gap:14px}
.welcome .l .eyebrow{color:#A9C2F8}
.welcome .l h1{color:#fff;font-size:34px;line-height:1.12}
.welcome .l p{color:#DCE6FD;margin:0;font-size:15.5px}
.welcome .r{padding:28px 30px;display:flex;flex-direction:column;gap:14px}
.pillar{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule)}
.pillar b{display:block;font-size:15px;color:var(--head)}
.pillar span{font-size:13.5px;color:var(--muted)}
.wblocks{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));width:100%;gap:4px;margin-top:auto;opacity:.9}
.wblocks i{aspect-ratio:1;border-radius:2px;border:1px solid rgba(255,255,255,.18)}
.wblocks i.bl{background:rgba(212,111,104,.9);border-color:transparent}
.wblocks i.bt{background:#5C8BFF;border-color:transparent}

.foot{margin-top:28px;color:var(--faint);font-size:12.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.flash{animation:flash 1.4s}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(42,106,241,.6)}100%{box-shadow:0 0 0 14px rgba(42,106,241,0)}}

/* ---------- responsive ---------- */
@media (max-width:1280px){
  .call-grid{grid-template-columns:300px minmax(0,1fr)}
  .call-grid > :last-child{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .dgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:1120px){
  .grid-main,.g2,.g3{grid-template-columns:minmax(0,1fr)}
  .brand span{display:none}
  .jump{display:none}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fact:nth-child(2){border-right:0}
  .fact:nth-child(-n+2){border-bottom:1px solid var(--rule)}
  .welcome{grid-template-columns:1fr}
  .whybox{grid-template-columns:repeat(2,minmax(0,1fr));padding-left:18px}
  .matrix{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi > div:nth-child(2){border-right:0}
  .kpi > div:nth-child(-n+2){border-bottom:1px solid var(--rule)}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:60px;flex-direction:row;justify-content:space-around;padding:0 4px}
  .side .logo,.side .spacer{display:none}
  .nav{width:auto;flex:1;height:60px}
  .nav .tip{display:none}
  .nav[aria-current="true"]::before{left:20%;right:20%;top:0;bottom:auto;width:auto;height:3px;border-radius:0 0 3px 3px}
  .top{padding:0 16px;gap:8px}
  .who span{display:none}
  .main{padding:16px 16px 150px}
  .call-grid,.vs,.dgrid,.call-grid > :last-child{grid-template-columns:minmax(0,1fr)}
  .sched{grid-template-columns:1fr}
  .nowgrid{grid-template-columns:minmax(0,1fr)!important}
  .numtable{display:block;overflow-x:auto}
  .nowgrid .btn{white-space:normal;height:auto!important;padding:10px 14px;text-align:left}
  .sl{grid-template-columns:minmax(0,1fr) 90px 40px}
  .callhead{grid-template-columns:1fr}
  .mhead{grid-template-columns:1fr}
  .sev{align-items:flex-start;text-align:left}
  .qtable thead{display:none}
  .qtable,.qtable tbody,.qtable tr,.qtable td{display:block;width:100%}
  .qtable tr.qrow{border-bottom:1px solid var(--rule);padding:8px 0}
  .qtable td{border:0;padding:4px 14px}
  .qtable td.hide-m{display:none}
  .scorebar{justify-content:flex-start}
  .medtable,.atable,.sig,.ttable{display:block;overflow-x:auto}
  .matrix,.kpi{grid-template-columns:minmax(0,1fr)}
  .kpi > div{border-right:0;border-bottom:1px solid var(--rule)}
  .phase{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tourcard{right:16px;bottom:76px}
  .toasts{bottom:80px}
  .simclock .sec,.dlong,.tlbl,.brand{display:none}
  .dshort{display:inline}
  .clockbox{margin:0 auto 0 0}
  .who .avatar{display:none}
  .recipe{grid-template-columns:1fr}
  .welcome .l h1{font-size:27px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Screens">
    <div class="logo" aria-hidden="true">MC</div>
    <button class="nav" data-go="queue"><span data-ic="queue"></span><span class="tip">Queue · who first today</span></button>
    <button class="nav" data-go="member"><span data-ic="user"></span><span class="tip">Member handoff (I-PASS)</span></button>
    <button class="nav" data-go="call"><span data-ic="phone"></span><span class="tip">Call &amp; confirm</span></button>
    <button class="nav" data-go="flag"><span data-ic="flag"></span><span class="tip">Flag review</span></button>
    <button class="nav" data-go="data"><span data-ic="layers"></span><span class="tip">Data &amp; trust</span></button>
    <button class="nav" data-go="impact"><span data-ic="chart"></span><span class="tip">Impact &amp; pilot</span></button>
    <div class="spacer"></div>
    <button class="nav" data-act="ledger" aria-label="Record of write-backs"><span data-ic="db"></span><span class="tip">Write-back record</span><span class="badge" id="ledgerBadge" hidden>0</span></button>
  </nav>
  <div>
    <header class="top">
      <div class="brand"><b>MCheck<sup>®</sup> Handoff</b><span>Lakeshore Health Plan · care management</span></div>
      <div class="clockbox">
        <div class="simclock" id="simclock" aria-live="off">Monday 9 November, 08:00</div>
        <div class="jump" role="group" aria-label="Jump to a moment in Maria's Monday">
          <button data-jump="08:00">08:00</button><button data-jump="08:15">08:15</button><button data-jump="11:00">11:00</button><button data-jump="15:42">15:42</button>
        </div>
      </div>
      <button class="btn sm primary" data-act="tour" id="tourBtn" aria-label="Guided tour"><span data-ic="play"></span><span class="tlbl">Guided tour</span></button>
      <button class="iconbtn" data-act="palette" aria-label="Search everything (Ctrl K)" title="Search everything (Ctrl K)"><span data-ic="search"></span></button>
      <button class="iconbtn" data-act="theme" aria-label="Toggle dark mode" title="Toggle dark mode"><span data-ic="moon"></span></button>
      <div class="who"><span>Maria R., RN <span class="mono">· 48 active cases</span></span><div class="avatar">MR</div></div>
    </header>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
</div>
<div id="overlay"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="prov" id="prov" hidden></div>
<div id="tour"></div>

function loadCard(){
  const base=[3,4,12,7,6], days=['Mon','Tue','Wed','Thu','Fri'], cap=6, max=12;
  const after=[6,6,6,6,6];
  const segs=S.rebalanced?[[3,3,0],[4,2,0],[6,0,0],[6,0,0],[6,0,0]]:base.map(v=>[v,0,0]);
  if(S.rebalanced){segs[2][2]=0;}
  const H=110;
  const bars=days.map((d,i)=>{

    const [own,pull]=segs[i];
    return `<div class="bar"><span class="v" style="color:${over?'var(--red)':'var(--head)'}">${v}</span><div class="stackb" style="height:${v/max*H}px">

  }).join('');

  const msg=S.rebalanced
   ?`<div class="callout green small"><b>Approved by supervisor ${S.rebalanced}.</b> Pulled forward to Mon–Tue: ${lp.pulled.map(q=>esc(q.name)).join(', ')}. To the float nurse (OH licence ✓, language ✓): ${esc(lp.floatW.name)} (Wed), ${esc(lp.floatT.name)} (Thu).</div>`
   :`<div class="callout red small"><b>Wed spike: 12 clocks vs 6.</b> Pull 5 routine calls into Mon–Tue spare slots; move 2 low-complexity calls (Wed, Thu) to the float nurse, licensed in OH.</div>`;
  return `<section class="card" data-tour="load"><div class="card-h"><div><h2>This week’s clock load</h2></div><span class="mono faint small">capacity ${cap}/day</span></div>
   <div class="card-b"><div class="bars" role="img" aria-label="Clock load: ${days.map((d,i)=>d+' '+(S.rebalanced?after[i]:base[i])).join(', ')}"><div class="cap" style="bottom:${cap/max*H+22}px"><span>${cap}</span></div>${bars}</div>

function tmCalc(x){
  const shift=480, prepped=10, talk=25, conv=3, coord=60, admin=45, fpc=2.5;
  const lost=x.triage+prepped*x.prep+x.failed*fpc+conv*x.doc;
  const used=lost+conv*talk+coord+admin;
  const freed=Math.max(0,shift-used);
  const cost=talk+x.doc+x.prep+2*fpc;
  const added=Math.floor(freed/cost);
  const convs=conv+added;
  const lostAfter=x.triage+x.prep*(prepped+added)+(x.failed+2*added)*fpc+x.doc*convs;
  const over=lostAfter/convs;
  const connect=convs/(convs+x.failed+2*added);
  const cap=freed/shift*97550*1.3;
  return {lost,used,freed,added,convs,over,connect,cap,ratio:cap/6000,cost};
}
function blocks(x,mode){
  const c=tmCalc(x); const lostB=Math.round(c.lost/10), talkB=7.5, other=10.5;
  const cells=[]; for(let i=0;i<48;i++){
    let k; if(i<lostB)k='lost'; else if(i<lostB+8)k='talk'; else if(i<lostB+18)k='other'; else k='free';
    cells.push(k);}
  // talking = 7.5 blocks: render 8th as half via gradient
  return `<div class="blocks" role="img" aria-label="${mode}: ${Math.round(c.lost/10)} of 48 blocks lost to data and paperwork">${cells.map((k,i)=>`<i class="blk ${k}" ${k==='talk'&&i===lostB+7?'style="background:linear-gradient(90deg,var(--blue) 50%,var(--blk-other) 50%)"':''}></i>`).join('')}</div>`;
}

  const inp=document.getElementById('palIn'); inp.focus(); palFill('');
  inp.addEventListener('input',()=>palFill(inp.value));
}
function palFill(q){
  const all=[
    ...[['queue','Queue · who first today'],['member','Member handoff'],['call','Call & confirm · Rosa 15:42'],['flag','Flag review · Gloria'],['data','Data & trust'],['impact','Impact & pilot']].map(([k,l])=>({l,s:'Screen',f:()=>go(k)})),
    ...Q.map(q=>({l:q.name,s:`#${q.rank} · ${q.program} · score ${q.score}`,f:()=>go('member',{member:q.key||q.name})})),
    ...ANNEX.recipes.map(r=>({l:`${r[0]} · ${r[1]}`,s:'Recipe',f:()=>{S.dataTab='recipes';S.rfilter='all';go('data')}})),
    ...ANNEX.datasets.map(d=>({l:`${d[1]}`,s:`Dataset ${d[0]} · ${d[7]}`,f:()=>{S.dataTab='datasets';S.dsel=d[0];go('data')}})),
    {l:'Start guided tour',s:'Action',f:()=>startTour()},{l:'Open write-back record',s:'Action',f:()=>ledgerDrawer()}];
  const t=q.toLowerCase().trim();
  palItems=(t?all.filter(i=>(i.l+' '+i.s).toLowerCase().includes(t)):all.slice(0,14)).slice(0,40); palSel=0;
  document.getElementById('palList').innerHTML=palItems.map((i,n)=>`<li role="option" data-pal="${n}" aria-selected="${n===0}">${esc(i.l)}<span>${esc(i.s)}</span></li>`).join('')||'<li class="muted">No results</li>';
}

const $prov=document.getElementById('prov');
function showProv(el){
  const [src,rec,note]=el.dataset.prov.split('|');
  $prov.innerHTML=`<div class="pk">Source</div><div>${esc(src)}</div>${rec?`<div class="pk" style="margin-top:6px">Arrived / freshness</div><div class="pv">${esc(rec)}</div>`:''}${note?`<div class="pk" style="margin-top:6px">Rule</div><div>${esc(note)}</div>`:''}`;
  $prov.hidden=false; const r=el.getBoundingClientRect(); const w=$prov.offsetWidth,h=$prov.offsetHeight;
  let x=Math.min(window.innerWidth-w-10,Math.max(10,r.left)); let y=r.bottom+8; if(y+h>window.innerHeight-10) y=r.top-h-8;
  $prov.style.left=x+'px'; $prov.style.top=y+'px';
}
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-prov]'); if(el&&el.dataset.prov) showProv(el); else $prov.hidden=true;});
document.addEventListener('focusin',e=>{const el=e.target.closest('[data-prov]'); if(el&&el.dataset.prov) showProv(el); else $prov.hidden=true;});
window.addEventListener('scroll',()=>{$prov.hidden=true; if(S.tour) placeSpot();},{passive:true});

function startTour(i=0){ closeModal(); S.dwayneDone=false; S.tour={i}; runStep(); }
function endTour(){ S.tour=null; document.getElementById('tour').innerHTML=''; }
function runStep(){
  const st=TOUR[S.tour.i]; closeModal(); S.t=toS(st.t);
  if(st.act) st.act();
  if(st.s!==S.screen||(st.m&&st.m!==S.member)) go(st.s,{member:st.m}); else render(true);
  const el=document.querySelector(st.sel); if(el) el.scrollIntoView({block:'center',behavior:'smooth'});
  setTimeout(placeSpot,420);
  document.getElementById('tour').innerHTML=`<div class="spot" id="spot"></div><div class="tourcard" role="dialog" aria-label="Guided tour"><div class="tc-h"><span class="stamp">Mon ${st.t}</span><span class="slide">${st.slide}</span></div>
   <div class="tc-b"><h3>${st.h}</h3><p>${st.p}</p></div>
   <div class="tc-f"><div class="dots">${TOUR.map((_,n)=>`<i class="${n<=S.tour.i?'on':''}"></i>`).join('')}</div><div class="row" style="flex-wrap:nowrap"><button class="btn sm ghost" data-act="tourEnd">End</button>${S.tour.i>0?`<button class="btn sm" data-act="tourPrev">Back</button>`:''}<button class="btn sm primary" data-act="tourNext">${S.tour.i===TOUR.length-1?'Finish':'Next'}</button></div></div></div>`;
}
function placeSpot(){
  const sp=document.getElementById('spot'); if(!sp||!S.tour) return;
  const el=document.querySelector(TOUR[S.tour.i].sel); if(!el){sp.style.opacity=0;return;}
  const r=el.getBoundingClientRect(); sp.style.opacity=1;
  Object.assign(sp.style,{left:(r.left-6)+'px',top:(r.top-6)+'px',width:(r.width+12)+'px',height:(r.height+12)+'px'});
}
window.addEventListener('resize',()=>S.tour&&placeSpot());

  if(d.pal!=null){ const it=palItems[+d.pal]; closeModal(); it&&it.f(); return; }

  if(d.why){ S.whyOpen[d.why]=!S.whyOpen[d.why]; render(true); return; }
  if(d.qf){ S.qfilter=d.qf; render(true); return; }
  if(d.sev){ const m=S.member; const old=S.severity[m]; S.severity[m]=d.sev; if(old!==d.sev) log(`${M[m].name}: illness severity`,old,d.sev,'set by Maria','writeback'); render(true); return; }
  if(d.ai){ S.aiConfirmed[d.ai]=nowStr(); const [mk,id]=d.ai.split(':'); const a=M[mk].ai.find(x=>x.id===id); log(`${M[mk].name}: ${a.l}`, 'AI-read', 'clinician-verified', 'UM, member services, next CM'); toast(`${a.l} confirmed · written back`); render(true); return; }
  if(d.done){ S.actionsDone[d.done]=!S.actionsDone[d.done]; render(true); return; }
  if(d.af){ S.call.filter=d.af; render(true); return; }
  if(d.read){ S.call.read[d.read]=!S.call.read[d.read]; render(true); return; }
  if(d.dt){ S.dataTab=d.dt; S.dsel=null; render(); return; }
  if(d.df){ S.dfilter=d.df; render(true); return; }
  if(d.ds){ S.dsel=+d.ds; render(true); return; }
  if(d.rf){ S.rfilter=d.rf; render(true); return; }
  if(d.if){ S.ifilter=d.if; render(true); return; }
  if(d.recipe){ S.dataTab='recipes'; S.rfilter='all'; go('data'); setTimeout(()=>{const el=document.getElementById('recipe-'+d.recipe); if(el){el.scrollIntoView({block:'center'}); el.classList.add('flash');}},60); return; }
  if(d.preset){ S.tm={today:{triage:30,prep:12,failed:18,doc:35},cons:{triage:20,prep:7,failed:15,doc:25},target:{triage:10,prep:4,failed:12,doc:15}}[d.preset]; render(true); return; }
  switch(d.act){
    case 'tour': S.tour?endTour():startTour(); break;

    case 'tourEnd': endTour(); break;

    case 'tourPrev': if(S.tour.i>0){S.tour.i--;runStep();} break;

    case 'ledger': ledgerDrawer(); break;
    case 'theme': { const cur=document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); const nx=cur==='dark'?'light':'dark'; document.documentElement.dataset.theme=nx; try{localStorage.setItem('mc-theme',nx)}catch(err){} break; }
    case 'callDwayne': dwayneModal(); break;
    case 'saveDwayne': {
      if(S.t<toS('08:04')) S.t=toS('08:04');
      const ck=k=>$ov.querySelector(`[data-dw="${k}"]`).checked;

      if(ck('inh')) log('Dwayne Pruitt: controller inhaler','gap 130 days','starter dispensed at ED discharge','case record');
      if(ck('fqhc')) {log('Dwayne Pruitt: PCP attribution','Dr. J. Whitaker (ghost listing)','Eastfield FQHC (pending)','eligibility · MCheck directory'); log('Dwayne Pruitt: ride to Eastfield FQHC','','booked (D-SNP transport)','task','task');}

    case 'rebalance': S.rebalanced=nowStr(); { const lp=loadPlan(); lp.pulled.forEach(q=>log(`${q.name}: call moved`,q.due,'Mon/Tue spare slot','supervisor approved','route')); log(`${lp.floatW.name}: call routed`,'Maria','float nurse (OH licence, language checked)','supervisor approved','route'); log(`${lp.floatT.name}: call routed`,'Maria','float nurse (OH licence, language checked)','supervisor approved','route'); } closeModal(); render(true); toast('Spike flattened: every day at or under capacity'); break;

      S.call.saved=true; S.call.endT=S.t;
      [['Rosa Delgado: preferred language','blank','Spanish, interpreter needed','eligibility'],['Rosa Delgado: best contact','landline (614) 555-0186','Marisol (614) 555-0187, 15:30–17:00','contact points'],['Rosa Delgado: falls in past year','0 (HRA Nov 2025)','2','HRA · case record'],['Rosa Delgado: authorisation renewal','expires 30 Nov','form sent by SMS','consent']].forEach(a=>log(...a));
      log('Rosa Delgado: identity link “Delgado-Ruiz”','suggested 0.94','sent to data steward','MCheck identity','task');
      render(true); toast('Saved · 4 facts written back, 1 sent to the data steward'); break; }
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.item!=null){ S.call.items[t.dataset.item]=t.checked; return; }
  if(t.dataset.j){ S.call.j[t.dataset.j]=t.value; render(true); return; }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='qsearch'){ S.qsearch=t.value; const pos=t.selectionStart; render(true); const n=document.getElementById('qsearch'); n.focus(); n.setSelectionRange(pos,pos); return; }
  if(t.dataset.tm){ S.tm[t.dataset.tm]=+t.value; const id=t.id; render(true); const n=document.getElementById(id); n&&n.focus(); return; }
});
document.addEventListener('focusout',e=>{ const t=e.target; if(t.dataset&&t.dataset.j&&t.tagName==='INPUT'){ if(S.call.j[t.dataset.j]!==t.value){S.call.j[t.dataset.j]=t.value; render(true);} } });
let qSel=-1;
document.addEventListener('keydown',e=>{
  const typing=/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); palette(); return; }
  if(e.key==='Escape'){ if(S.dsel){S.dsel=null;render(true);} if($ov.innerHTML){ closeModal(); } else if(S.tour) endTour(); return; }
  const pal=document.getElementById('palList');
  if(pal){ if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); palSel=Math.max(0,Math.min(palItems.length-1,palSel+(e.key==='ArrowDown'?1:-1))); pal.querySelectorAll('li').forEach((l,i)=>l.setAttribute('aria-selected',String(i===palSel))); pal.children[palSel]&&pal.children[palSel].scrollIntoView({block:'nearest'}); } else if(e.key==='Enter'){ const it=palItems[palSel]; closeModal(); it&&it.f(); } return; }
  if(typing||$ov.innerHTML) { if(e.key==='Enter'&&document.activeElement.dataset&&document.activeElement.dataset.row){document.activeElement.click();} return; }
  if(S.tour&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){ e.preventDefault(); document.querySelector(`[data-act="${e.key==='ArrowRight'?'tourNext':'tourPrev'}"]`)?.click(); return; }
  const k=e.key.toLowerCase();
  const scr={1:'queue',2:'member',3:'call',4:'flag',5:'data',6:'impact'}[e.key]; if(scr){ go(scr); return; }
  if(k==='t'){ S.tour?endTour():startTour(); return; }
  if(k==='d'){ document.querySelector('[data-act="theme"]').click(); return; }
  if(e.key==='?'){ helpModal(); return; }
  if(S.screen==='queue'&&(k==='j'||k==='k')){ const rows=[...document.querySelectorAll('tr.qrow')]; if(!rows.length) return; qSel=Math.max(0,Math.min(rows.length-1,qSel+(k==='j'?1:-1))); rows.forEach(r=>r.classList.remove('sel')); rows[qSel].classList.add('sel'); rows[qSel].focus(); return; }
  if(e.key==='Enter'&&document.activeElement.dataset&&document.activeElement.dataset.row){ document.activeElement.click(); }
});

/* =========================================================

   ========================================================= */
const DAYS='Monday 9 November';
function tick(force){
  const sc=document.getElementById('simclock');
  sc.innerHTML=`<span class="dlong">${DAYS}, </span><span class="dshort">Mon </span>${nowStr()}<span class="sec">:${String(S.t%60).padStart(2,'0')}</span>`;
  document.querySelectorAll('.jump button').forEach(b=>b.setAttribute('aria-pressed',String(nowStr()===b.dataset.jump)));
  const ed=document.querySelector('[data-live="edtimer"]'); if(ed) ed.textContent=edTimer();
  const ct=document.querySelector('[data-live="calltimer"]'); if(ct) ct.textContent=fmtDur(callDur());
  const dt=document.querySelector('[data-live="doctimer"]'); if(dt) dt.textContent=docMin();
}
let lastGone=false, lastDme=false;
setInterval(()=>{
  if(!S.running) return; S.t+=1; tick();
  const g=dwayneGone(), dm=dmeDecided();
  if((g!==lastGone||dm!==lastDme)&&!$ov.innerHTML&&!/INPUT|SELECT/.test(document.activeElement.tagName)){ lastGone=g; lastDme=dm; render(true); }
},1000);

/* boot */
render();
lastGone=dwayneGone(); lastDme=dmeDecided();
let seen=false; try{seen=localStorage.getItem('mc-welcome')==='1'; localStorage.setItem('mc-welcome','1');}catch(e){}
const params=new URLSearchParams(location.search);
if(params.get('tour')==='1') startTour(); else if(!seen||params.get('welcome')==='1') welcome();
</script>
